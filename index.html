<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RadioHost - Ao Vivo</title>
<style>
  body{margin:0;background:#08080f;color:#fff;font-family:Arial}
  .top{background:#11111c;border-bottom:1px solid #222;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;position:sticky;top:0;z-index:99}
  .brand{display:flex;align-items:center;gap:10px}
  .brand img{width:48px;height:48px;border-radius:12px;box-shadow:0 0 12px #00f0ff;object-fit:cover}
  .brand h1{margin:0;font-size:22px;font-weight:900}
  .brand .c{color:#00f0ff;text-shadow:0 0 10px #00f0ff}
  .brand .p{color:#ff2ea6;text-shadow:0 0 10px #ff2ea6}
  .player-top{display:flex;align-items:center;gap:10px;background:#1a1a2e;padding:6px 12px;border-radius:30px;border:1px solid #2e2e4e}
  .tocando{font-size:11px;color:#00ff88;display:flex;align-items:center;gap:5px;font-weight:bold}
  .dot{width:8px;height:8px;background:#00ff88;border-radius:50%;box-shadow:0 0 8px #00ff88;animation:blink 1s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
  .player-top audio{width:160px;height:30px}
  .main{min-height:80vh;display:flex;justify-content:center;align-items:center;padding:20px}
  .card{background:#151525;padding:30px;border-radius:20px;max-width:400px;width:100%;text-align:center;border:1px solid #2a2a50;box-shadow:0 0 40px rgba(0,240,255,.15)}
  #admin{display:none;background:#fff;color:#000}
  input,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;box-sizing:border-box}
  button{border:0;background:linear-gradient(90deg,#00f0ff,#ff2ea6);color:#fff;font-weight:bold;cursor:pointer}
  @media(max-width:600px){.player-top audio{width:110px}.brand h1{font-size:18px}}
</style>
</head>
<body>

<div class="top">
  <div class="brand">
    <img src="logo.png">
    <h1><span class="c">RÁDIO</span><span class="p">HOST</span></h1>
  </div>
  <div class="player-top">
    <div class="tocando"><div class="dot"></div> TOCANDO</div>
    <audio controls autoplay src="https://stream.zeno.fm/kmbjkezl7uetv"></audio>
  </div>
</div>

<div class="main">
  <div class="card" id="site">
    <h2>🔴 AO VIVO NO AR</h2>
    <p style="opacity:.7">Sua rádio 24 horas no ar</p>
    <img src="logo.png" style="width:100%;border-radius:15px;margin-top:15px;box-shadow:0 0 20px rgba(0,240,255,.3)">
    <p style="font-size:12px;opacity:.5;margin-top:15px">/admin para configurar</p>
  </div>

  <div class="card" id="admin">
    <h2>Painel Admin</h2>
    <input id="n" placeholder="Nome da Rádio">
    <input id="l" placeholder="Link Stream">
    <button onclick="localStorage.setItem('n',document.getElementById('n').value);localStorage.setItem('l',document.getElementById('l').value);location.href='/'">Salvar</button>
  </div>
</div>

<script>
if(location.pathname=='/admin'){
  document.getElementById('site').style.display='none';
  document.getElementById('admin').style.display='block';
}
const nn=localStorage.getItem('n');
if(nn) document.querySelector('#site h2').innerText=nn;
const ll=localStorage.getItem('l');
if(ll) document.querySelectorAll('audio').forEach(a=>a.src=ll);
</script>
</body>
</html>
