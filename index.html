<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RádioHost Premium</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
.dot{width:8px;height:8px;background:#00ff88;border-radius:50%;box-shadow:0 0 8px #00ff88;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
:root{--primary-color:#7c3aed;--text-dark:#1e293b;--text-light:#94a3b8;--bg-card:#18181b}
.recursos-radio{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;font-family:'Segoe UI',Roboto,sans-serif;padding:40px 20px;max-width:1200px;margin:0 auto}
.recurso-item{background:#18181b;padding:30px;border-radius:16px;border:1px solid #27272a;box-shadow:0 4px 6px -1px rgba(0,0,0,.3);transition:all.3s ease}
.recurso-item:hover{transform:translateY(-5px);border-color:var(--primary-color);box-shadow:0 10px 20px -3px rgba(124,58,237,.3)}
.recurso-icon{font-size:32px;color:var(--primary-color);margin-bottom:18px;display:inline-block}
.recurso-item h3{color:white;margin:0 0 10px 0;font-size:18px;font-weight:700}
.recurso-item p{color:#a1a1aa;font-size:13px;line-height:1.6;margin:0}
</style>
</head>
<body class="bg-[#0f0f0f] text-white">
<div class="sticky top-0 z-50 bg-[#11111c] border-b border-[#23233a] p-3">
<div class="max-w-7xl mx-auto flex justify-between items-center">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-lg bg-gradient-to-br from-[#00f0ff] to-[#ff2ea6] flex items-center justify-center font-black">R</div>
<h1 class="text-xl font-black"><span class="text-[#00f0ff]">RÁDIO</span><span class="text-[#ff2ea6]">HOST</span></h1>
</div>
<div class="flex items-center gap-2 bg-[#1a1a2e] border border-zinc-700 px-3 py-1.5 rounded-full">
<div class="dot"></div>
<button onclick="toggleTopPlay()" class="bg-green-500 text-black w-7 h-7 rounded-full flex items-center justify-center"><i id="iconTop" class="fa fa-play text-xs"></i></button>
<span class="text-[10px] font-bold text-[#00ff88]">AO VIVO</span>
<audio id="topPlayer" style="display:none"><source src="https://stream.zeno.fm/kmbjkezl7uetv" type="audio/mpeg"></audio>
</div>
</div>
</div>
<div id="app"></div>
<script>
const ADMIN_EMAIL="admin@radiohost.com.br",ADMIN_PASS="clans123",MEU_PIX="radioclansweb@gmail.com";
let radios=JSON.parse(localStorage.getItem('rh_radios')||'[]');
let tempDados=JSON.parse(sessionStorage.getItem('rh_temp')||'null');
let topPlaying=false;
function save(){localStorage.setItem('rh_radios',JSON.stringify(radios))}
function toggleTopPlay(){const p=document.getElementById('topPlayer'),i=document.getElementById('iconTop');if(!topPlaying){p.play();i.className='fa fa-pause text-xs';topPlaying=true}else{p.pause();i.className='fa fa-play text-xs';topPlaying=false}}
function router(){
const h=location.hash;
if(h.includes('admin-dashboard')) renderAdminDashboard();
else if(h.includes('admin')) renderAdminLogin();
else if(h.includes('painel')) renderPainel(h.split('=')[1]);
else if(h.includes('pagamento')) renderPagamento();
else renderHome();
}
function renderHome(){
document.getElementById('app').innerHTML=`
<section class="max-w-7xl mx-auto px-5 py-10 grid md:grid-cols-2 gap-10">
<div>
<div class="inline-block bg-purple-600/20 text-purple-400 px-3 py-1 rounded-full text-xs mb-4">DEMO AO VIVO NO TOPO</div>
<h2 class="text-5xl font-black">SEU STREAMING<br><span class="text-purple-500">PROFISSIONAL</span></h2>
<p class="text-zinc-400 text-sm mt-3">Painel com AutoDJ + 20 mil músicas grátis inclusas</p>
<div class="grid grid-cols-3 gap-3 mt-8">
<div class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl text-center"><p class="font-bold text-xl">R$20</p><p class="text-xs text-zinc-500">15 DIAS<br>100 Ouv.</p><button onclick="selectPlan('15 DIAS - R$20','20')" class="mt-2 w-full bg-zinc-800 py-1.5 rounded text-xs">Escolher</button></div>
<div class="bg-purple-600 p-4 rounded-xl text-center border-2 border-purple-400"><p class="font-bold text-xl">R$30</p><p class="text-xs">30 DIAS<br>500 Ouv.</p><button onclick="selectPlan('30 DIAS - R$30','30')" class="mt-2 w-full bg-white text-purple-600 py-1.5 rounded text-xs font-bold">Escolher</button></div>
<div class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl text-center"><p class="font-bold text-xl">R$600</p><p class="text-xs text-zinc-500">12 MESES<br>ILIMITADO</p><button onclick="selectPlan('12 MESES - R$600','600')" class="mt-2 w-full bg-zinc-800 py-1.5 rounded text-xs">Escolher</button></div>
</div>
</div>
<div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6">
<h3 class="font-bold text-lg mb-4">CRIAR MINHA RÁDIO</h3>
<input id="nome" class="w-full bg-black border border-zinc-800 rounded p-3 mb-3" placeholder="Nome da Rádio">
<input id="pessoa" class="w-full bg-black border border-zinc-800 rounded p-3 mb-3" placeholder="Seu Nome">
<input id="email" class="w-full bg-black border border-zinc-800 rounded p-3 mb-3" placeholder="Seu E-mail">
<input id="plano" class="w-full bg-black border border-zinc-800 rounded p-3 mb-1" value="30 DIAS - R$30" readonly>
<input id="valor" type="hidden" value="30">
<p class="text-[10px] text-zinc-500 mb-4">Liberação automática após PIX ${MEU_PIX}</p>
<button onclick="irPagamento()" class="w-full bg-green-500 text-black font-black py-3 rounded-xl">IR PARA PAGAMENTO PIX</button>
</div>
</section>

<section class="recursos-radio">
  <div class="recurso-item"><div class="recurso-icon"><i class="fa-solid fa-mobile-screen-button"></i></div><h3>Aplicativo Exclusivo</h3><p>Seus Ouvintes Poderão Instalar Seu App Exclusivo, Em Smartphones Android e iPhone.</p></div>
  <div class="recurso-item"><div class="recurso-icon"><i class="fa-solid fa-globe"></i></div><h3>Site Completo</h3><p>Temos um Site Para Rádio Completo e Com Subdomínio.webradios.net Incluso.</p></div>
  <div class="recurso-item"><div class="recurso-icon"><i class="fa-solid fa-microphone-lines"></i></div><h3>Programas e Programetes</h3><p>Mais de 200 Programas e Programetes Para Você Implementar Na Sua Programação.</p></div>
  <div class="recurso-item"><div class="recurso-icon"><i class="fa-solid fa-music"></i></div><h3>Banco de Músicas Grátis</h3><p>São Mais de 20 Mil Músicas Grátis Classificadas Por Gênero. Para o AutoDJ no Painel do Streaming. Em Todos os Planos.</p></div>
  <div class="recurso-item"><div class="recurso-icon"><i class="fa-solid fa-lock"></i></div><h3>Players Com HTTPS</h3><p>Nossos Players São Todos Com Certificado Seguro Https. Além Dos Links Shoutcast e Icecast.</p></div>
  <div class="recurso-item"><div class="recurso-icon"><i class="fa-solid fa-chart-line"></i></div><h3>Estatísticas</h3><p>Acompanhe Sua Audiência e Veja o Horário, Dia e Mês Mais Movimentado. Além de Países, Cidades e Estados.</p></div>
  <div class="recurso-item"><div class="recurso-icon"><i class="fa-solid fa-sliders"></i></div><h3>Painel Exclusivo</h3><p>Gerencie Sua Programação Completa Através da Nossa Plataforma. E Você Também Poderá Transmitir Ao Vivo Pelo Navegador do Seu Smartphone.</p></div>
  <div class="recurso-item"><div class="recurso-icon"><i class="fa-solid fa-users"></i></div><h3>Vários Locutores</h3><p>Crie uma senha exclusiva para cada locutor e tenha controle total sobre a sua equipe.</p></div>
</section>

<div class="text-center pb-10"><a href="#admin" class="text-[10px] text-zinc-700 hover:text-white">Acesso ADM #admin</a></div>
`;
}
function selectPlan(p,v){document.getElementById('plano').value=p;document.getElementById('valor').value=v;}
function irPagamento(){
const nome=document.getElementById('nome').value,pessoa=document.getElementById('pessoa').value,email=document.getElementById('email').value,plano=document.getElementById('plano').value,valor=document.getElementById('valor').value;
if(!nome||!pessoa||!email){alert('Preencha tudo');return;}
tempDados={nome,pessoa,email,plano,valor};sessionStorage.setItem('rh_temp',JSON.stringify(tempDados));location.hash='pagamento';router();
}
function renderPagamento(){
if(!tempDados){renderHome();return;}
const qr=encodeURIComponent(MEU_PIX);
document.getElementById('app').innerHTML=`
<div class="max-w-lg mx-auto p-5"><div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 text-center">
<h2 class="text-2xl font-black">PAGAMENTO PIX</h2><p class="text-sm text-zinc-400 mt-2">Rádio: <b class="text-purple-400">${tempDados.nome}</b> - ${tempDados.plano} R$${tempDados.valor}</p>
<div class="bg-white p-3 rounded-xl mt-5 mx-auto w-56"><img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${qr}" class="w-full"><p class="text-black text-[10px] font-bold mt-1">${MEU_PIX}</p></div>
<div class="bg-black border border-zinc-800 p-3 rounded mt-4 text-left"><p class="text-[10px] text-zinc-500">CHAVE PIX EMAIL:</p><p class="text-sm font-bold text-green-400 break-all">${MEU_PIX}</p><button onclick="navigator.clipboard.writeText('${MEU_PIX}');alert('PIX copiado!')" class="mt-2 w-full bg-zinc-800 py-2 rounded text-xs">COPIAR PIX</button></div>
<button onclick="confirmarPagamento()" class="w-full bg-green-500 text-black font-black py-3 rounded-xl mt-5">JÁ PAGUEI, LIBERAR MINHA RÁDIO</button>
<a href="/" class="text-xs text-zinc-500 mt-4 inline-block">Voltar</a>
</div></div>`;
}
function confirmarPagamento(){if(!tempDados)return;const id=Date.now().toString();radios.push({id,nome:tempDados.nome,pessoa:tempDados.pessoa,email:tempDados.email,plano:tempDados.plano,valor:tempDados.valor,data:new Date().toLocaleString(),status:'pago',ouvintes:Math.floor(Math.random()*40+5)});save();sessionStorage.removeItem('rh_temp');tempDados=null;location.hash='painel='+id;router();}
let rh_playlist=[],rh_index=0;
function renderPainel(id){
const r=radios.find(x=>x.id==id);
if(!r){document.getElementById('app').innerHTML=`<div class="p-10 text-center">Rádio não encontrada. Faça o pagamento primeiro.<br><a href="/" class="text-purple-400">Voltar</a></div>`;return;}
document.getElementById('app').innerHTML=`
<div class="p-5 max-w-5xl mx-auto">
<div class="bg-zinc-900 border border-zinc-800 rounded-xl p-5">
<h3 class="font-bold text-xl">Bem-vindo, ${r.pessoa}!</h3>
<p class="text-sm text-zinc-400">Rádio <b class="text-purple-400">${r.nome}</b> - ${r.plano} - <span class="text-green-400">R$${r.valor} PAGO</span></p>
<div class="bg-green-900/30 border border-green-700 p-3 rounded mt-4 text-sm flex justify-between items-center">
<div>✅ CONFIRMADO - ${MEU_PIX}<br>STATUS: <b class="text-green-400">● AO VIVO 24H</b> | AutoDJ: <span id="statusAuto" class="text-zinc-400">Desligado</span> | <span class="text-purple-400">20 mil músicas inclusas</span></div>
<button id="btnAuto" onclick="toggleAuto()" class="bg-green-500 text-black font-black px-5 py-2 rounded-xl">▶ ABRIR AUTODJ</button>
</div>
<div class="mt-4 bg-black border border-zinc-800 rounded-xl p-4">
<audio id="audiodj" controls class="w-full" onended="nextTrack()"></audio>
<p class="text-xs text-zinc-500 mt-2">Tocando agora: <span id="now" class="text-white">Nenhuma música</span></p>
</div>
<div class="border-2 border-dashed border-zinc-700 rounded-xl p-6 text-center mt-4">
<input type="file" id="fileInput" accept=".mp3,audio/*" multiple hidden onchange="uploadFiles(this.files)">
<button onclick="document.getElementById('fileInput').click()" class="bg-purple-600 px-6 py-3 rounded-xl font-bold text-sm"><i class="fa fa-upload"></i> SUBIR MÚSICAS MP3 / ABRIR PASTA</button>
<p class="text-[11px] text-zinc-500 mt-2">Sua pasta já vem com músicas demo. Adicione mais MP3 se quiser.</p>
</div>
<div id="lista" class="mt-4"></div>
<a href="/" class="text-xs text-zinc-500 mt-6 block">Voltar ao site</a>
</div>
</div>`;
let salvos=JSON.parse(sessionStorage.getItem('rh_playlist_'+id)||'null');
if(salvos && salvos.length>0){rh_playlist=salvos;} else {
rh_playlist=[
{name:'Rádio Ao Vivo - Stream Oficial (Demo)',size:'Stream Oficial',url:'https://stream.zeno.fm/kmbjkezl7uetv'},
{name:'Banco Grátis 1 - Pop Hits (Demo)',size:'20 mil músicas - Demo',url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'},
{name:'Banco Grátis 2 - Sertanejo (Demo)',size:'20 mil músicas - Demo',url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3'},
{name:'Banco Grátis 3 - Gospel (Demo)',size:'20 mil músicas - Demo',url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3'}
];
}
renderLista();
}
function renderLista(){
const div=document.getElementById('lista');
if(!rh_playlist.length){div.innerHTML='<p class="text-center text-zinc-500 text-sm p-4">Nenhuma música ainda.</p>';return;}
div.innerHTML=rh_playlist.map((m,i)=>`<div class="bg-zinc-900 border border-zinc-800 p-3 rounded flex justify-between items-center mb-2"><div><p class="font-bold text-sm">${i+1}. ${m.name}</p><p class="text-[10px] text-zinc-500">${m.size}</p></div><div class="flex gap-2"><button onclick="playTrack(${i})" class="bg-white text-black px-3 py-1 rounded text-xs">Tocar</button><button onclick="removeTrack(${i})" class="bg-red-900/40 border border-red-700 px-2 py-1 rounded text-xs">X</button></div></div>`).join('');
}
function uploadFiles(files){
for(let f of files){let url=URL.createObjectURL(f);rh_playlist.push({name:f.name,size:(f.size/1024/1024).toFixed(2)+' MB',url:url});}
const id=location.hash.split('=')[1];
sessionStorage.setItem('rh_playlist_'+id, JSON.stringify(rh_playlist));
renderLista();
}
function playTrack(i){rh_index=i;let m=rh_playlist[i];if(!m)return;let a=document.getElementById('audiodj');a.src=m.url;a.play();document.getElementById('now').innerText=m.name;document.getElementById('statusAuto').innerText='Tocando';}
function nextTrack(){rh_index++;if(rh_index>=rh_playlist.length) rh_index=0;playTrack(rh_index);}
function toggleAuto(){
let a=document.getElementById('audiodj');let b=document.getElementById('btnAuto');let s=document.getElementById('statusAuto');
if(a.paused){
if(rh_playlist.length==0){alert('Adicione MP3 primeiro');return;}
if(!a.src) playTrack(rh_index); else a.play();
b.innerText='⏸ FECHAR AUTODJ';b.className='bg-red-500 text-white font-black px-5 py-2 rounded-xl';s.innerText='Ligado - Tocando';s.className='text-green-400';
}else{a.pause();b.innerText='▶ ABRIR AUTODJ';b.className='bg-green-500 text-black font-black px-5 py-2 rounded-xl';s.innerText='Pausado';s.className='text-yellow-400';}
}
function removeTrack(i){rh_playlist.splice(i,1);const id=location.hash.split('=')[1];sessionStorage.setItem('rh_playlist_'+id, JSON.stringify(rh_playlist));renderLista();}
function renderAdminLogin(){
document.getElementById('app').innerHTML=`<div class="min-h-[80vh] flex items-center justify-center p-5"><div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-8 w-full max-w-sm"><h2 class="text-2xl font-black text-center mb-6">LOGIN ADM</h2><input id="adm_email" class="w-full bg-black border border-zinc-800 rounded p-3 mb-3" value="admin@radiohost.com.br"><input id="adm_pass" type="password" class="w-full bg-black border border-zinc-800 rounded p-3 mb-4" value="clans123"><button onclick="doAdminLogin()" class="w-full bg-purple-600 font-bold py-3 rounded-xl">ENTRAR</button><p id="err" class="text-red-400 text-xs mt-3 text-center hidden">Senha incorreta</p></div></div>`;
}
function doAdminLogin(){const e=document.getElementById('adm_email').value,p=document.getElementById('adm_pass').value;if(e===ADMIN_EMAIL&&p===ADMIN_PASS){localStorage.setItem('rh_admin','logado');location.hash='admin-dashboard';router()}else document.getElementById('err').classList.remove('hidden');}
function renderAdminDashboard(){
if(localStorage.getItem('rh_admin')!=='logado'){renderAdminLogin();return;}
let fat=radios.reduce((a,b)=>a+parseInt(b.valor||30),0),ouv=radios.reduce((a,b)=>a+b.ouvintes,0);
document.getElementById('app').innerHTML=`
<div class="max-w-6xl mx-auto p-5">
<h2 class="text-2xl font-black">#admin-dashboard</h2>
<div class="grid grid-cols-3 gap-3 my-5">
<div class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl"><p class="text-xs text-zinc-500">Rádios</p><p class="text-2xl font-bold">${radios.length}</p></div>
<div class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl"><p class="text-xs text-zinc-500">Faturamento ${MEU_PIX}</p><p class="text-2xl font-bold text-green-400">R$${fat}</p></div>
<div class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl"><p class="text-xs text-zinc-500">Ouvintes</p><p class="text-2xl font-bold">${ouv}</p></div>
</div>
<div class="bg-zinc-900 border border-zinc-800 rounded-xl overflow-auto">
<table class="w-full text-sm"><thead class="bg-black text-zinc-500 text-xs"><tr><th class="p-3 text-left">Rádio</th><th class="p-3">Cliente / Email</th><th class="p-3">Plano</th><th class="p-3">Ação</th></tr></thead>
<tbody>${radios.map(r=>`<tr class="border-t border-zinc-800"><td class="p-3 font-bold">${r.nome}</td><td class="p-3">${r.pessoa}<br><span class="text-xs text-purple-400">${r.email}</span></td><td class="p-3 text-green-400">${r.plano}</td><td class="p-3"><button onclick="location.hash='painel=${r.id}';router()" class="bg-white text-black px-3 py-1 rounded text-xs">Ver Painel</button></td></tr>`).join('')||'<tr><td colspan=4 class="p-6 text-center text-zinc-500">Nenhuma ainda</td></tr>'}</tbody></table>
</div>
<a href="/" class="text-xs text-zinc-500 mt-4 block">Voltar</a>
</div>`;
}
window.addEventListener('hashchange',router);router();
</script>
</body>
  </html>
