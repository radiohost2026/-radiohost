<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RádioHost Premium</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    :root {
      --purple: #7c3aed;
      --cyan: #00f0ff;
      --pink: #ff2ea6;
      --green: #00ff88;
      --bg: #0f0f0f;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: white;
      font-family: Inter, Segoe UI, Roboto, Arial, sans-serif;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--green);
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%,100% { opacity: 1; }
      50% { opacity: .3; }
    }

    .gradient-text {
      background: linear-gradient(90deg, var(--cyan), var(--pink));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 18px;
    }

    .input {
      width: 100%;
      background: #050505;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 13px;
      color: white;
      outline: none;
    }

    .input:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 2px rgba(124,58,237,.15);
    }

    .btn {
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 800;
      transition: .2s;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.78);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 200;
    }

    .modal.active {
      display: flex;
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 999;
      background: #18181b;
      border: 1px solid #3f3f46;
      padding: 14px 18px;
      border-radius: 12px;
      transform: translateY(120px);
      opacity: 0;
      transition: .3s;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .stat {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 18px;
      padding: 20px;
    }

    .resource {
      background: #18181b;
      border: 1px solid #27272a;
      padding: 25px;
      border-radius: 18px;
      transition: .25s;
    }

    .resource:hover {
      transform: translateY(-4px);
      border-color: var(--purple);
    }
  </style>
</head>

/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const CONFIG = {

  adminEmail: "admin@radiohost.com.br",

  adminPassword: "clans123",

  pix: "radioclansweb@gmail.com",

  commission: 0.20,

  stream: "https://stream.zeno.fm/kmbjkezl7uetv"

/* =========================================================
   BANCO LOCAL
========================================================= */

let radios =
  JSON.parse(localStorage.getItem("rh_radios") || "[]");

let affiliates =
  JSON.parse(localStorage.getItem("rh_affiliates") || "[]");

let commissions =
  JSON.parse(localStorage.getItem("rh_commissions") || "[]");

let withdrawals =
  JSON.parse(localStorage.getItem("rh_withdrawals") || "[]");


let selectedPlan = {
  name: "30 DIAS - R$30",
  value: 30
};


let currentAffiliate =
  sessionStorage.getItem("rh_affiliate_id") || null;


/* =========================================================
   STORAGE
========================================================= */

function saveAll() {

  localStorage.setItem(
    "rh_radios",
    JSON.stringify(radios)
  );

  localStorage.setItem(
    "rh_affiliates",
    JSON.stringify(affiliates)
  );

  localStorage.setItem(
    "rh_commissions",
    JSON.stringify(commissions)
  );

  localStorage.setItem(
    "rh_withdrawals",
    JSON.stringify(withdrawals)
  );
}


/* =========================================================
   HELPERS
========================================================= */

function id() {

  return Date.now().toString(36) +
    Math.random().toString(36).slice(2,8);

}


function money(value) {

  return Number(value || 0).toLocaleString(
    "pt-BR",
    {
      style: "currency",
      currency: "BRL"
    }
  );

}


function escapeHTML(value) {

  return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function toast(message, error = false) {

  const box =
    document.getElementById("toast");

  const text =
    document.getElementById("toastText");

  const icon =
    document.getElementById("toastIcon");

  text.textContent = message;

  icon.className =
    error
    ? "fa-solid fa-circle-xmark text-red-400"
    : "fa-solid fa-circle-check text-green-400";

  box.classList.add("show");

  setTimeout(() => {
    box.classList.remove("show");
  }, 3000);

}


/* =========================================================
   PLAYER
========================================================= */

let playing = false;


function toggleRadio() {

  const player =
    document.getElementById("radioPlayer");

  const icon =
    document.getElementById("topPlayIcon");

  if (!playing) {

    player.play()
      .then(() => {

        playing = true;

        icon.className =
          "fa-solid fa-pause text-xs";

      })
      .catch(() => {

        toast(
          "Não foi possível iniciar o streaming.",
          true
        );

      });

  } else {

    player.pause();

    playing = false;

    icon.className =
      "fa-solid fa-play text-xs";

  }

}


/* =========================================================
   PLANOS
========================================================= */

function choosePlan(name,value) {

  selectedPlan = {
    name,
    value:Number(value)
  };

  const plan =
    document.getElementById("planInput");

  const val =
    document.getElementById("valueInput");

  if (plan) plan.value = name;

  if (val) val.value = value;

  toast("Plano selecionado: " + name);

  document
    .getElementById("cadastro")
    ?.scrollIntoView({
      behavior:"smooth"
    });

}

/* =========================================================
   PAGAMENTO RÁDIO
========================================================= */

function openPayment() {

  const name =
    document.getElementById("radioName").value.trim();

  const person =
    document.getElementById("personName").value.trim();

  const email =
    document.getElementById("radioEmail").value.trim();

  if (!name || !person || !email) {

    toast(
      "Preencha todos os dados.",
      true
    );

    return;

  }

  if (!email.includes("@")) {

    toast(
      "Digite um e-mail válido.",
      true
    );

    return;

  }

  document.getElementById("payPlan").textContent =
    selectedPlan.name;

  document.getElementById("payValue").textContent =
    money(selectedPlan.value);

  document.getElementById("pixDisplay").textContent =
    CONFIG.pix;

  document
    .getElementById("paymentModal")
    .classList.add("active");

}


function closePayment() {

  document
    .getElementById("paymentModal")
    .classList.remove("active");

}


function copyPIX() {

  navigator.clipboard
    .writeText(CONFIG.pix)
    .then(() => toast("PIX copiado!"));

}


function finishPayment() {

  const radio = {

    id:id(),

    radio:
      document.getElementById("radioName").value.trim(),

    responsavel:
      document.getElementById("personName").value.trim(),

    email:
      document.getElementById("radioEmail").value.trim(),

    plano:selectedPlan.name,

    valor:selectedPlan.value,

    status:"Aguardando confirmação",

    afiliado:getReferralCode(),

    criadoEm:new Date().toLocaleString("pt-BR")

  };


  radios.push(radio);

  /*
    Se existir um afiliado responsável pela indicação,
    cria uma comissão pendente.
  */

  if (radio.afiliado) {

    const affiliate =
      affiliates.find(
        a => a.code === radio.afiliado
      );

    if (affiliate) {

      commissions.push({

        id:id(),

        affiliateId:affiliate.id,

        radioId:radio.id,

        customer:radio.radio,

        amount:
          Number(radio.valor) *
          CONFIG.commission,

        status:"Pendente",

        createdAt:
          new Date().toLocaleString("pt-BR")

      });

    }

  }


  saveAll();

  closePayment();

  toast(
    "Cadastro realizado com sucesso!"
  );

  setTimeout(() => {

    location.hash =
      "painel=" + radio.id;

  }, 1000);

}

function getReferralCode() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("ref") || null;

}

   SAQUE AFILIADO
========================================================= */

function requestWithdrawal() {

  const affiliate =
    affiliates.find(
      a => a.id === currentAffiliate
    );

  if (!affiliate) return;


  const amount =
    Number(
      document
        .getElementById("withdrawAmount")
        .value
    );


  const pix =
    document
      .getElementById("withdrawPix")
      .value
      .trim();


  const approved =
    commissions
      .filter(
        c =>
          c.affiliateId === affiliate.id &&
          c.status === "Aprovada"
      )
      .reduce(
        (sum,c) =>
          sum + Number(c.amount),
        0
      );


  if (!amount || amount <= 0) {

    toast(
      "Digite um valor válido.",
      true
    );

    return;

  }


  if (amount > approved) {

    toast(
      "Saldo aprovado insuficiente.",
      true
    );

    return;

  }


  if (!pix) {

    toast(
      "Informe sua chave PIX.",
      true
    );

    return;

  }


  withdrawals.push({

    id:id(),

    affiliateId:
      affiliate.id,

    amount,

    pix,

    status:"Solicitado",

    createdAt:
      new Date().toLocaleString("pt-BR")

  });


  /*
    Marca comissões aprovadas como
    vinculadas ao saque.
  */

  let remaining = amount;

  commissions.forEach(c => {

    if (
      c.affiliateId === affiliate.id &&
      c.status === "Aprovada" &&
      remaining > 0
    ) {

      const value =
        Number(c.amount);

      if (value <= remaining) {

        c.status = "Paga";

        remaining -= value;

      }

    }

  });


  affiliate.pix = pix;

  saveAll();

  toast(
    "Solicitação de saque enviada."
  );

  renderAffiliateDashboard();

}

              <th class="p-4">Valor</th>
              <th class="p-4">PIX</th>
              <th class="p-4">Status</th>
              <th class="p-4">Ação</th>

            </tr>

          </thead>

          <tbody>

            ${
              withdrawals.length === 0

              ? `
                <tr>
                  <td colspan="5" class="p-8 text-center text-zinc-600">
                    Nenhuma solicitação.
                  </td>
                </tr>
              `

              : withdrawals.map(w => {

                const a =
                  affiliates.find(
                    x =>
                      x.id ===
                      w.affiliateId
                  );

                return `

                <tr class="border-t border-zinc-800">

                  <td class="p-4">
                    ${a ? escapeHTML(a.name) : "-"}
                  </td>

                  <td class="p-4 text-green-400 font-bold">
                    ${money(w.amount)}
                  </td>

                  <td class="p-4 text-zinc-400">
                    ${escapeHTML(w.pix)}
                  </td>

                  <td class="p-4">
                    ${escapeHTML(w.status)}
                  </td>

                  <td class="p-4">

                    ${
                      w.status === "Solicitado"

                      ? `
                        <button
                          onclick="payWithdrawal('${w.id}')"
                          class="bg-green-600 px-3 py-1 rounded-lg text-xs"
                        >
                          Marcar como pago
                        </button>
                      `

                      : "-"
                    }

                  </td>

                </tr>

                `;

              }).join("")
            }

          </tbody>

        </table>

      </div>

    </div>

  </section>

  `;

}


function adminStat(
  title,
  value,
  icon
) {

  return `

  <div class="stat">

    <div class="flex justify-between">

      <div>

        <p class="text-xs text-zinc-500">
          ${title}
        </p>

        <strong class="text-2xl font-black block mt-1">
          ${value}
        </strong>

      </div>

      <i class="fa-solid ${icon} text-purple-400"></i>

    </div>

  </div>

  `;

}


/* =========================================================
   ADMIN - RÁDIOS
========================================================= */

function activateRadio(idRadio) {

  const radio =
    radios.find(
      r => r.id === idRadio
    );

  if (!radio) return;

  radio.status = "Ativa";

  /*
    Ao ativar a rádio, a comissão do afiliado
    continua pendente até aprovação administrativa.
  */

  saveAll();

  toast(
    "Rádio ativada."
  );

  renderAdminDashboard();

}


function deleteRadio(idRadio) {

  if (
    !confirm(
      "Excluir esta rádio?"
    )
  ) return;

  radios =
    radios.filter(
      r => r.id !== idRadio
    );

  saveAll();

  renderAdminDashboard();

}


function toggleAffiliate(idAffiliate) {

  const affiliate =
    affiliates.find(
      a => a.id === idAffiliate
    );

  if (!affiliate) return;

  affiliate.status =
    affiliate.status === "Ativo"
    ? "Bloqueado"
    : "Ativo";

  saveAll();

  renderAdminDashboard();

}


/* =========================================================
   ADMIN - COMISSÕES
========================================================= */

function approveCommission(idCommission) {

  const commission =
    commissions.find(
      c =>
        c.id === idCommission
    );

  if (!commission) return;

  commission.status =
    "Aprovada";

  saveAll();

  toast(
    "Comissão aprovada."
  );

  renderAdminDashboard();

}


/* =========================================================
   ADMIN - SAQUES
========================================================= */

function payWithdrawal(idWithdrawal) {

  const withdrawal =
    withdrawals.find(
      w =>
        w.id === idWithdrawal
    );

  if (!withdrawal) return;

  withdrawal.status =
    "Pago";

  saveAll();

  toast(
    "Saque marcado como pago."
  );

  renderAdminDashboard();

}


/* =========================================================
   PAINEL CLIENTE
========================================================= */

function renderClientPanel(idRadio) {

  const radio =
    radios.find(
      r =>
        r.id === idRadio
    );

  if (!radio) {

    location.hash =
      "home";

    return;

  }


  document.getElementById("app").innerHTML = `

  <section class="max-w-7xl mx-auto px-5 py-12">

    <div class="flex justify-between items-center mb-7">

      <div>

        <p class="text-xs text-purple-400 uppercase font-bold">
          Painel da rádio
        </p>

        <h1 class="text-3xl font-black">
          ${escapeHTML(radio.radio)}
        </h1>

      </div>

      <span class="bg-green-500/10 text-green-400 px-3 py-2 rounded-full text-xs">
        ${escapeHTML(radio.status)}
      </span>

    </div>


    <div class="grid md:grid-cols-3 gap-5">

      <div class="md:col-span-2 card p-6">

        <h3 class="font-black text-xl">
          Informações da rádio
        </h3>

        <div class="grid sm:grid-cols-2 gap-4 mt-5">

          ${info("Responsável",radio.responsavel)}

          ${info("E-mail",radio.email)}

          ${info("Plano",radio.plano)}

          ${info("Status",radio.status)}

        </div>

      </div>


      <div class="card p-6">

        <div class="w-14 h-14 bg-purple-600 rounded-xl flex items-center justify-center text-xl">
          <i class="fa-solid fa-radio"></i>
        </div>

        <h3 class="font-black mt-5">
          Streaming
        </h3>

        <button
          onclick="toggleRadio()"
          class="btn w-full bg-green-500 text-black mt-5"
        >
          OUVIR RÁDIO
        </button>

      </div>

    </div>

  </section>

  `;

}


function info(label,value) {

  return `

  <div class="bg-black border border-zinc-800 rounded-xl p-4">

    <p class="text-xs text-zinc-500">
      ${label}
    </p>

    <p class="font-bold text-sm mt-1 break-all">
      ${escapeHTML(value)}
    </p>

  </div>

  `;

}


/* =========================================================
   ROTEADOR
========================================================= */

function router() {

  const hash =
    location.hash.replace("#","");


  if (hash === "") {

    renderHome();

  }

  else if (hash === "home") {

    renderHome();

  }

  else if (hash === "admin") {

    renderAdminLogin();

  }

  else if (hash === "admin-dashboard") {

    renderAdminDashboard();

  }

  else if (hash === "afiliado-cadastro") {

    renderAffiliateRegister();

  }

  else if (hash === "afiliado-login") {

    renderAffiliateLogin();

  }

  else if (hash === "afiliado-dashboard") {

    renderAffiliateDashboard();

  }

  else if (hash.startsWith("painel=")) {

    renderClientPanel(
      decodeURIComponent(
        hash.substring(7)
      )
    );

  }

  else {

    renderHome();

  }


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================================
   EVENTOS
========================================================= */

window.addEventListener(
  "hashchange",
  router
);


window.addEventListener(
  "DOMContentLoaded",
  router
);


document.addEventListener(
  "click",
  event => {

    const modal =
      document.getElementById("paymentModal");

    if (
      event.target === modal
    ) {

      closePayment();

    }

  }
);

</script>

</body>
