<div id="app"></div>
<script>
const ADMIN_EMAIL="admin@radiohost.com.br",ADMIN_PASS="clans123";let radios=JSON.parse(localStorage.getItem('rh_radios')||'[]');function save(){localStorage.setItem('rh_radios',JSON.stringify(radios))}function router(){const h=location.hash,p=location.pathname;if(p.includes('admin')||h.includes('admin')){if(h.includes('admin-dashboard'))renderAdminDashboard();else renderAdminLogin()}else if(h.includes('painel'))renderPainel(h.split('=')[1]);else renderHome()}function renderHome(){document.getElementById('app').innerHTML=`<header class="p-5 flex justify-between max-w-7xl mx-auto"><a href="/admin" class="bg-zinc-800 px-4 py-2 rounded text-sm">Admin</a><span class="text-xs text-zinc-500">${radios.length} ativas</span></header><section class="max-w-7xl mx-auto px-5 py-6 grid md:grid-cols-2 gap-10"><div><div class="inline-block bg-purple-600/20 text-purple-400 px-3 py-1 rounded-full text-xs mb-4">AO VIVO</div><h2 class="text-5xl font-black">SEU STREAMING<br><span class="text-purple-500">PROFISSIONAL</span></h2><div class="grid grid-cols-3 gap-3 mt-8"><div class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl text-center"><p class="font-bold">R$20</p><p class="text-xs text-zinc-500">15 DIAS</p><button onclick="selectPlan('15 DIAS - R$20')" class="mt-2 w-full bg-zinc-800 py-1 rounded text-xs">Escolher</button></div><div class="bg-purple-600 p-4 rounded-xl text-center border-2 border-purple-400"><p class="font-bold">R$30</p><p class="text-xs">30 DIAS</p><button onclick="selectPlan('30 DIAS - R$30')" class="mt-2 w-full bg-white text-purple-600 py-1 rounded text-xs font-bold">Escolher</button></div><div class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl text-center"><p class="font-bold">R$600</p><p class="text-xs text-zinc-500">12 MESES</p><button onclick="selectPlan('12 MESES - R$600')" class="mt-2 w-full bg-zinc-800 py-1 rounded text-xs">Escolher</button></div></div></div><div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6"><h3 class="font-bold mb-4">CRIAR MINHA RÁDIO</h3><input id="nome" class="w-full bg-black border border-zinc-800 rounded p-3 mb-3" placeholder="Nome da Rádio"><input id="pessoa" class="w-full bg-black border border-zinc-800 rounded p-3 mb-3" placeholder="Seu Nome"><input id="email" class="w-full bg-black border border-zinc-800 rounded p-3 mb-3" placeholder="Seu E-mail"><input id="plano" class="w-full bg-black border border-zinc-800 rounded p-3 mb-4" value="30 DIAS - R$30" readonly><button onclick="criarRadio()" class="w-full bg-green-500 text-black font-black py-3 rounded-xl">CRIAR RÁDIO</button></div></section>`}function selectPlan(p){document.getElementById('plano').value=p}function criarRadio(){const n=document.getElementById('nome').value,pe=document.getElementById('pessoa').value,e=document.getElementById('email').value,pl=document.getElementById('plano').value;if(!n||!pe||!e){alert('Preencha');return}const id=Date.now().toString();radios.push({id,nome:n,pessoa:pe,email:e,plano:pl,ouvintes:Math.floor(Math.random()*40+5)});save();location.hash='painel='+id;router()}function renderPainel(id){const r=radios.find(x=>x.id==id)||radios[0];if(!r){renderHome();return}document.getElementById('app').innerHTML=`<div class="p-5 max-w-4xl mx-auto"><div class="bg-zinc-900 border border-zinc-800 rounded-xl p-5"><h3 class="font-bold text-xl">Bem-vindo, ${r.pessoa}!</h3><p>Sua rádio <b class="text-purple-400">${r.nome}</b> - ${r.plano}</p><div class="bg-black p-3 rounded border border-zinc-800 mt-4">STATUS: <b class="text-green-400">● AO VIVO 24H</b> | Ouvintes: ${r.ouvintes}</div><div class="border-2 border-dashed border-zinc-700 rounded-xl p-10 text-center mt-4">Arraste MP3 aqui - AutoDJ Ativo</div><div class="mt-3 text-xs bg-black p-2 rounded">Stream: https://stream.zeno.fm/${r.id}</div><a href="/" class="text-xs text-zinc-500 mt-4 inline-block">Voltar</a></div></div>`}function renderAdminLogin(){document.getElementById('app').innerHTML=`<div class="min-h-[80vh] flex items-center justify-center p-5"><div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-8 w-full max-w-sm"><h2 class="text-2xl font-black text-center mb-6">LOGIN ADMIN</h2><input id="adm_email" class="w-full bg-black border border-zinc-800 rounded p-3 mb-3" value="admin@radiohost.com.br"><input id="adm_pass" type="password" class="w-full bg-black border border-zinc-800 rounded p-3 mb-4" placeholder="clans123"><button onclick="doAdminLogin()" class="w-full bg-purple-600 font-bold py-3 rounded-xl">ENTRAR</button><p id="err" class="text-red-400 text-xs mt-3 text-center hidden">Senha incorreta</p></div></div>`}function doAdminLogin(){const e=document.getElementById('adm_email').value,p=document.getElementById('adm_pass').value;if(e===ADMIN_EMAIL&&p===ADMIN_PASS){localStorage.setItem('rh_admin','logado');location.hash='admin-dashboard';router()}else document.getElementById('err').classList.remove('hidden')}function renderAdminDashboard(){if(localStorage.getItem('rh_admin')!=='logado'){renderAdminLogin();return}let fat=radios.length*30;document.getElementById('app').innerHTML=`<div class="max-w-6xl mx-auto p-5"><h2 class="text-2xl font-black mb-2">ADMIN - ${radios.length} rádios</h2><div class="grid grid-cols-3 gap-3 mb-6"><div class="bg-zinc-900 p-4 rounded-xl">Rádios: <b>${radios.length}</b></div><div class="bg-zinc-900 p-4 rounded-xl">Fat: <b class="text-green-400">R$${fat}</b></div><div class="bg-zinc-900 p-4 rounded-xl">Ouv: <b>${radios.reduce((a,b)=>a+b.ouvintes,0)}</b></div></div><div class="bg-zinc-900 border border-zinc-800 rounded-xl overflow-auto"><table class="w-full text-sm"><thead class="bg-black text-zinc-500 text-xs"><tr><th class="p-3 text-left">Rádio</th><th>Cliente</th><th>Email</th><th>Plano</th><th>Ação</th></tr></thead><tbody>${radios.map(r=>`<tr class="border-t border-zinc-800"><td class="p-3 font-bold">${r.nome}</td><td class="p-3">${r.pessoa}</td><td class="p-3 text-xs">${r.email}</td><td class="p-3 text-green-400">${r.plano}</td><td class="p-3"><button onclick="location.hash='painel=${r.id}';router()" class="bg-white text-black px-3 py-1 rounded text-xs">Ver</button></td></tr>`).join('')||'<tr><td colspan=5 class="p-6 text-center text-zinc-500">Nenhuma</td></tr>'}</tbody></table></div><a href="/" class="text-xs text-zinc-500 mt-4 block">Voltar</a></div>`}
window.addEventListener('hashchange',router);router();
</script>
