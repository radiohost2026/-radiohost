<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RádioHost</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white">
<header class="p-5 flex justify-between"><b>RÁDIO<span class="text-purple-500">HOST</span></b><a href="#ia" class="bg-purple-600 px-5 py-1 rounded-full text-sm">TESTAR IA</a></header>

<section class="text-center py-16 px-4">
<h1 class="text-4xl md:text-6xl font-black">SUA RÁDIO ONLINE<br><span class="text-purple-400">24H NO AR</span></h1>

<!-- PLAYER AZURACAST INTEGRADO -->
<div class="max-w-md mx-auto mt-8 bg-zinc-900 p-5 rounded-2xl border border-zinc-800">
<p class="text-xs text-zinc-500 mb-2">🔴 AO VIVO - RÁDIOHOST + AZURACAST</p>
<audio id="radio" controls autoplay class="w-full">
<source src="https://SEU_AZURACAST_AQUI/radio.mp3" type="audio/mp3">
</audio>
<div id="musica" class="mt-3 text-sm text-purple-300">Conectando no AzuraCast...</div>
</div>

<div id="ia" class="max-w-lg mx-auto mt-12 bg-zinc-900 p-5 rounded-2xl text-left">
<h3 class="font-bold mb-3">🎙️ Gerador de Vinheta IA (Gemini)</h3>
<textarea id="txt" class="w-full bg-black border border-zinc-700 rounded p-3 h-20" placeholder="Ex: Você está na melhor, RádioHost!"></textarea>
<button onclick="gerar()" class="w-full mt-3 bg-purple-600 py-3 rounded-xl font-bold">GERAR LOCUÇÃO</button>
<audio id="voz" controls class="w-full mt-3 hidden"></audio>
<p id="st" class="text-xs text-zinc-500 mt-2"></p>
</div>
</section>

<script>
const AZURA_URL = "https://SEU_AZURACAST_AQUI"; // << TROQUE AQUI SEU LINK

async function gerar(){
 const t=document.getElementById('txt').value; if(!t)return alert('Digite o texto');
 document.getElementById('st').innerText='Gerando...';
 const r=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t})});
 const d=await r.json();
 if(d.error){document.getElementById('st').innerText='Erro: '+d.error; return;}
 document.getElementById('voz').src=d.audio; document.getElementById('voz').classList.remove('hidden');
 document.getElementById('st').innerText='Pronto! Baixe e use no AzuraCast.';
}
async function now(){
 try{ const r=await fetch(`${AZURA_URL}/api/nowplaying`); const j=await r.json(); const s=j[0].now_playing.song; document.getElementById('musica').innerText=s.artist+' - '+s.title; }catch(e){ document.getElementById('musica').innerText='Rádio ao vivo tocando'; }
}
setInterval(now,10000); now();
</script>
</body>
</html>
