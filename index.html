<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RádioHost Premium</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--purple:#7c3aed;--cyan:#00f0ff;--pink:#ff2ea6;--green:#00ff88;--bg:#0f0f0f}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:white;font-family:Inter,Segoe UI,Roboto,Arial,sans-serif}
.dot{width:8px;height:8px;background:var(--green);border-radius:50%;box-shadow:0 0 8px var(--green);animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.gradient-text{background:linear-gradient(90deg,var(--cyan),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:#18181b;border:1px solid #27272a;border-radius:18px}
.input{width:100%;background:#050505;border:1px solid #27272a;border-radius:12px;padding:13px;color:white;outline:none}
.input:focus{border-color:var(--purple);box-shadow:0 0 0 2px rgba(124,58,237,.15)}
.btn{border-radius:12px;padding:12px 18px;font-weight:800;transition:.2s;cursor:pointer}
.btn:hover{transform:translateY(-1px)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;padding:20px;z-index:200}
.modal.active{display:flex}
.toast{position:fixed;right:20px;bottom:20px;z-index:999;background:#18181b;border:1px solid #3f3f46;padding:14px 18px;border-radius:12px;transform:translateY(120px);opacity:0;transition:.3s}
.toast.show{transform:translateY(0);opacity:1}
.stat{background:#18181b;border:1px solid #27272a;border-radius:18px;padding:20px}
.resource{background:#18181b;border:1px solid #27272a;padding:25px;border-radius:18px;transition:.25s}
.resource:hover{transform:translateY(-4px);border-color:var(--purple)}
</style>
</head>
<body>
<header class="sticky top-0 z-50 bg-[#11111c]/95 backdrop-blur border-b border-[#27272a]">
<div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
<a href="#home" class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-400 to-pink-500 text-black font-black flex items-center justify-center">R</div><div class="font-black text-lg"><span class="text-cyan-400">RÁDIO</span><span class="text-pink-500">HOST</span></div></a>
<div class="flex items-center gap-3">
<nav class="hidden md:flex gap-5 text-xs text-zinc-400"><a href="#home" class="hover:text-white">Início</a><a href="#planos" class="hover:text-white">Planos</a><a href="#afiliados" class="hover:text-white">Afiliados</a><a href="#afiliado-login" class="hover:text-white">Área do Afiliado</a></nav>
<div class="flex items-center gap-2 bg-[#1a1a2e] border border-zinc-700 px-3 py-1.5 rounded-full"><div class="dot"></div><button onclick="toggleRadio()" class="bg-green-500 text-black w-7 h-7 rounded-full flex items-center justify-center"><i id="topPlayIcon" class="fa-solid fa-play text-xs"></i></button><span class="text-[10px] font-bold text-green-400">AO VIVO</span></div>
</div>
</div>
</header>
<audio id="radioPlayer" preload="none"><source src="https://radio.brazilianwave.com.br/radio.mp3" type="audio/mpeg"></audio>
<main id="app"></main>
<div id="toast" class="toast"><div class="flex items-center gap-3"><i id="toastIcon" class="fa-solid fa-circle-check text-green-400"></i><span id="toastText">Mensagem</span></div></div>
<div id="paymentModal" class="modal">
<div class="w-full max-w-md card p-6">
<div class="flex justify-between items-center mb-6"><div><h2 class="text-xl font-black">Pagamento PIX</h2><p class="text-xs text-green-400 font-bold">Envie o comprovante no WhatsApp</p></div><button onclick="closePayment()"><i class="fa-solid fa-xmark text-xl text-zinc-500"></i></button></div>
<div class="bg-black rounded-xl p-5 mb-5"><div class="flex justify-between mb-3"><span class="text-zinc-500 text-sm">Plano</span><strong id="payPlan"></strong></div><div class="flex justify-between"><span class="text-zinc-500 text-sm">Valor</span><strong id="payValue" class="text-green-400"></strong></div></div>
<p class="text-xs text-zinc-500 mb-2">Chave PIX (e-mail)</p><div id="pixDisplay" class="bg-black border border-purple-900 rounded-xl p-4 text-center text-purple-400 font-bold break-all"></div>
<button onclick="copyPIX()" class="btn w-full bg-purple-600 hover:bg-purple-500 mt-3"><i class="fa-regular fa-copy mr-2"></i>Copiar PIX</button>
<button onclick="sendWhatsAppProof()" class="btn w-full bg-green-500 hover:bg-green-400 text-black mt-3 text-[15px]"><i class="fa-brands fa-whatsapp mr-2 text-lg"></i>ENVIAR COMPROVANTE NO WHATSAPP</button>
<p class="text-[11px] text-zinc-500 text-center mt-3">Após pagar, clique acima e envie o comprovante para liberar sua rádio.</p>
</div>
</div>
<script>
const CONFIG={adminEmail:"admin@radiohost.com.br",adminPassword:"clans123",pix:"radioclansweb@gmail.com",whatsapp:"5517981135119",commission:0.20,stream:"https://radio.brazilianwave.com.br/radio.mp3"};
let radios=JSON.parse(localStorage.getItem("rh_radios")||"[]");let affiliates=JSON.parse(localStorage.getItem("rh_affiliates")||"[]");let commissions=JSON.parse(localStorage.getItem("rh_commissions")||"[]");let withdrawals=JSON.parse(localStorage.getItem("rh_withdrawals")||"[]");
let selectedPlan={name:"30 DIAS - R$30",value:30};let currentAffiliate=sessionStorage.getItem("rh_affiliate_id")||null;
function saveAll(){localStorage.setItem("rh_radios",JSON.stringify(radios));localStorage.setItem("rh_affiliates",JSON.stringify(affiliates));localStorage.setItem("rh_commissions",JSON.stringify(commissions));localStorage.setItem("rh_withdrawals",JSON.stringify(withdrawals));}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function money(v){return Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});}
function escapeHTML(v){return String(v||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
function toast(m,e=false){const b=document.getElementById("toast"),t=document.getElementById("toastText"),i=document.getElementById("toastIcon");t.textContent=m;i.className=e?"fa-solid fa-circle-xmark text-red-400":"fa-solid fa-circle-check text-green-400";b.classList.add("show");setTimeout(()=>b.classList.remove("show"),3000);}
let playing=false;
function toggleRadio(){const p=document.getElementById("radioPlayer"),ic=document.getElementById("topPlayIcon");if(!playing){p.play().then(()=>{playing=true;ic.className="fa-solid fa-pause text-xs";toast("Tocando ao vivo!");}).catch(()=>toast("Não foi possível iniciar.",true));}else{p.pause();playing=false;ic.className="fa-solid fa-play text-xs";}}
function choosePlan(n,v){selectedPlan={name:n,value:Number(v)};const pl=document.getElementById("planInput"),vl=document.getElementById("valueInput");if(pl)pl.value=n;if(vl)vl.value=v;toast("Plano selecionado: "+n);document.getElementById("cadastro")?.scrollIntoView({behavior:"smooth"});}
function renderHome(){
document.getElementById("app").innerHTML=`
<section class="max-w-7xl mx-auto px-5 py-14">
<div class="grid lg:grid-cols-2 gap-12 items-center">
<div>
<div class="inline-flex items-center gap-2 bg-purple-600/10 text-purple-400 px-3 py-1 rounded-full text-xs"><span class="dot"></span>AZURACAST ONLINE</div>
<h1 class="text-5xl md:text-6xl font-black leading-tight mt-5">SUA RÁDIO<br><span class="gradient-text">ONLINE PROFISSIONAL</span></h1>
<p class="text-zinc-400 mt-5 max-w-xl">Player AzuraCast <b>radio.brazilianwave.com.br</b> integrado + IA de vinhetas Gemini.</p>
<div class="flex flex-wrap gap-3 mt-7"><a href="#cadastro" class="btn bg-purple-600 hover:bg-purple-500">Criar minha rádio</a><button onclick="toggleRadio()" class="btn border border-zinc-700"><i class="fa-solid fa-play mr-2"></i>Ouvir rádio</button></div>
</div>
<div class="space-y-4">
<div class="card p-7">
<div class="bg-black rounded-2xl p-8 text-center"><div class="w-24 h-24 mx-auto rounded-full bg-gradient-to-br from-purple-600 to-pink-500 flex items-center justify-center text-3xl"><i class="fa-solid fa-radio"></i></div><h2 class="font-black text-2xl mt-5">RádioHost Live</h2><p class="text-zinc-500 text-sm mt-2">radio.brazilianwave.com.br • Ao vivo</p><button onclick="toggleRadio()" class="btn bg-green-500 text-black mt-6 px-8"><i class="fa-solid fa-play mr-2"></i>OUVIR AGORA</button><audio controls class="w-full mt-4"><source src="https://radio.brazilianwave.com.br/radio.mp3" type="audio/mpeg"></audio></div>
</div>
<div class="card p-5">
<h3 class="font-bold text-sm mb-2"><i class="fa-solid fa-wand-magic-sparkles text-purple-400"></i> Gerador de Vinheta IA (Gemini)</h3>
<textarea id="ttsText" class="input h-20 resize-none" placeholder="Ex: Você está na melhor, RádioHost!"></textarea>
<button id="ttsBtn" onclick="gerarVinheta()" class="btn w-full mt-3 bg-purple-600 hover:bg-purple-500"><i class="fa-solid fa-microphone"></i> GERAR LOCUÇÃO</button>
<audio id="ttsAudio" controls class="w-full mt-3 hidden"></audio>
<div id="ttsStatus" class="text-[11px] text-zinc-500 mt-2"></div>
</div>
</div>
</div>
</section>
<section id="planos" class="max-w-7xl mx-auto px-5 py-14">
<div class="text-center mb-10"><p class="text-purple-400 text-xs font-bold uppercase">Planos</p><h2 class="text-4xl font-black mt-2">Escolha seu plano</h2></div>
<div class="grid md:grid-cols-3 gap-5">
${plan("15 DIAS",20,"100 ouvintes")}
${plan("30 DIAS",30,"500 ouvintes",true)}
${plan("12 MESES",600,"Ouvintes ilimitados")}
</div>
</section>
<section id="cadastro" class="max-w-7xl mx-auto px-5 py-14">
<div class="grid lg:grid-cols-2 gap-10">
<div><p class="text-purple-400 text-xs font-bold uppercase">Comece agora</p><h2 class="text-4xl font-black mt-2">Crie sua rádio</h2><p class="text-zinc-400 mt-4 text-sm leading-7">Cadastre sua rádio e acompanhe o status pelo painel.</p><div class="mt-8 space-y-4">${check("Streaming AzuraCast")}${check("Player HTML5 integrado")}${check("Gerador de vinhetas IA")}${check("Programa de afiliados")}</div></div>
<div class="card p-6"><h3 class="font-black text-xl mb-5">Dados da rádio</h3><label class="text-xs text-zinc-400">Nome da Rádio</label><input id="radioName" class="input mt-2 mb-4" placeholder="Rádio Sucesso"><label class="text-xs text-zinc-400">Seu Nome</label><input id="personName" class="input mt-2 mb-4" placeholder="Seu nome"><label class="text-xs text-zinc-400">E-mail</label><input id="radioEmail" type="email" class="input mt-2 mb-4" placeholder="voce@email.com"><label class="text-xs text-zinc-400">Plano</label><input id="planInput" readonly value="30 DIAS - R$30" class="input mt-2 mb-4 text-purple-400 font-bold"><input id="valueInput" type="hidden" value="30"><button onclick="openPayment()" class="btn w-full bg-green-500 text-black"><i class="fa-solid fa-qrcode mr-2"></i>PAGAR COM PIX</button></div>
</div>
</section>
<section id="afiliados" class="max-w-7xl mx-auto px-5 py-14"><div class="card p-8"><div class="grid lg:grid-cols-2 gap-10 items-center"><div><span class="text-purple-400 text-xs font-bold uppercase">Programa de afiliados</span><h2 class="text-4xl font-black mt-3">Ganhe 20% de comissão</h2><p class="text-zinc-400 mt-4 text-sm leading-7">Crie sua conta de afiliado e divulgue a RádioHost.</p><a href="#afiliado-cadastro" class="btn inline-block bg-purple-600 mt-6">Quero ser afiliado</a></div><div class="grid sm:grid-cols-2 gap-4">${affiliateFeature("fa-link","Link exclusivo","Cada afiliado recebe seu próprio link.")}${affiliateFeature("fa-percent","20% de comissão","Comissão sobre vendas.")}${affiliateFeature("fa-chart-line","Dashboard","Acompanhe indicações.")}${affiliateFeature("fa-wallet","PIX","Cadastre sua chave PIX.")}</div></div></div></section>
<footer class="border-t border-zinc-800"><div class="max-w-7xl mx-auto px-5 py-8 flex flex-col md:flex-row justify-between gap-4"><p class="text-xs text-zinc-600">© ${new Date().getFullYear()} RádioHost Premium</p><div class="flex gap-5 text-xs text-zinc-500"><a href="#admin">Administração</a><a href="#afiliado-login">Afiliados</a></div></div></footer>`;
}
function plan(n,v,d,f=false){return `<div class="${f?"bg-purple-600 border-purple-400":"card"} p-6 relative">${f?`<div class="absolute -top-3 left-1/2 -translate-x-1/2 bg-white text-purple-600 text-[10px] font-black px-3 py-1 rounded-full">MAIS POPULAR</div>`:""}<p class="text-xs font-bold uppercase opacity-70">${n}</p><div class="text-4xl font-black mt-3">${money(v)}</div><p class="text-sm opacity-70 mt-2">${d}</p><button onclick="choosePlan('${n} - R$${v}','${v}')" class="w-full mt-6 py-3 rounded-xl font-bold ${f?"bg-white text-purple-600":"bg-zinc-800"}">Escolher</button></div>`;}
function check(t){return `<div class="flex items-center gap-3"><i class="fa-solid fa-check text-green-400"></i><span class="text-sm text-zinc-400">${t}</span></div>`;}
function affiliateFeature(i,t,d){return `<div class="bg-black border border-zinc-800 rounded-xl p-5"><i class="fa-solid ${i} text-purple-400 text-xl"></i><h4 class="font-bold mt-3">${t}</h4><p class="text-xs text-zinc-500 mt-2">${d}</p></div>`;}
function openPayment(){const n=document.getElementById("radioName").value.trim(),p=document.getElementById("personName").value.trim(),e=document.getElementById("radioEmail").value.trim();if(!n||!p||!e){toast("Preencha todos os dados.",true);return;}if(!e.includes("@")){toast("E-mail inválido.",true);return;}document.getElementById("payPlan").textContent=selectedPlan.name;document.getElementById("payValue").textContent=money(selectedPlan.value);document.getElementById("pixDisplay").textContent=CONFIG.pix;document.getElementById("paymentModal").classList.add("active");}
function closePayment(){document.getElementById("paymentModal").classList.remove("active");}
function copyPIX(){navigator.clipboard.writeText(CONFIG.pix).then(()=>toast("PIX copiado!"));}
function sendWhatsAppProof(){const rn=document.getElementById("radioName").value.trim(),pn=document.getElementById("personName").value.trim(),em=document.getElementById("radioEmail").value.trim();const radio={id:id(),radio:rn,responsavel:pn,email:em,plano:selectedPlan.name,valor:selectedPlan.value,status:"Aguardando confirmação",afiliado:getReferralCode(),criadoEm:new Date().toLocaleString("pt-BR")};radios.push(radio);if(radio.afiliado){const aff=affiliates.find(a=>a.code===radio.afiliado);if(aff){commissions.push({id:id(),affiliateId:aff.id,radioId:radio.id,customer:radio.radio,amount:Number(radio.valor)*CONFIG.commission,status:"Pendente",createdAt:new Date().toLocaleString("pt-BR")});}}saveAll();closePayment();const msg=`Olá! Paguei a RádioHost%0A%0A*Plano:* ${encodeURIComponent(radio.plano)} - ${encodeURIComponent(money(radio.valor))}%0A*Rádio:* ${encodeURIComponent(radio.radio)}%0A*Nome:* ${encodeURIComponent(radio.responsavel)}%0A*E-mail:* ${encodeURIComponent(radio.email)}%0A%0AEstou enviando o comprovante PIX agora. Chave: ${CONFIG.pix}`;window.open(`https://wa.me/${CONFIG.whatsapp}?text=${msg}`,'_blank');toast("Cadastro criado! Envie o comprovante no WhatsApp.");setTimeout(()=>{location.hash="painel="+radio.id;},1500);}
function getReferralCode(){const p=new URLSearchParams(window.location.search);return p.get("ref")||null;}
function renderAffiliateRegister(){document.getElementById("app").innerHTML=`<section class="min-h-[75vh] flex items-center justify-center px-5 py-12"><div class="w-full max-w-lg card p-7"><div class="text-center mb-7"><div class="w-16 h-16 mx-auto rounded-2xl bg-purple-600 flex items-center justify-center text-2xl"><i class="fa-solid fa-users"></i></div><h2 class="text-2xl font-black mt-4">Criar conta de afiliado</h2><p class="text-zinc-500 text-sm mt-2">Ganhe 20% indicando novos clientes.</p></div><input id="affName" class="input mb-3" placeholder="Seu nome"><input id="affEmail" type="email" class="input mb-3" placeholder="Seu e-mail"><input id="affPassword" type="password" class="input mb-3" placeholder="Crie uma senha"><input id="affPix" class="input mb-4" placeholder="Sua chave PIX"><button onclick="registerAffiliate()" class="btn w-full bg-purple-600">CRIAR MINHA CONTA</button><p class="text-center text-xs text-zinc-500 mt-5">Já possui conta? <a href="#afiliado-login" class="text-purple-400">Entrar</a></p></div></section>`;}
function registerAffiliate(){const n=document.getElementById("affName").value.trim(),e=document.getElementById("affEmail").value.trim(),p=document.getElementById("affPassword").value,x=document.getElementById("affPix").value.trim();if(!n||!e||!p||!x){toast("Preencha todos os campos.",true);return;}if(affiliates.some(a=>a.email.toLowerCase()===e.toLowerCase())){toast("E-mail já cadastrado.",true);return;}const aff={id:id(),name:n,email:e,password:p,pix:x,code:"RH"+Math.random().toString(36).substring(2,8).toUpperCase(),status:"Ativo",createdAt:new Date().toLocaleString("pt-BR")};affiliates.push(aff);saveAll();sessionStorage.setItem("rh_affiliate_id",aff.id);currentAffiliate=aff.id;toast("Conta criada!");setTimeout(()=>{location.hash="afiliado-dashboard";},700);}
function renderAffiliateLogin(){document.getElementById("app").innerHTML=`<section class="min-h-[75vh] flex items-center justify-center px-5"><div class="w-full max-w-md card p-7"><div class="text-center mb-7"><div class="w-16 h-16 mx-auto rounded-2xl bg-purple-600 flex items-center justify-center text-2xl"><i class="fa-solid fa-user-tie"></i></div><h2 class="text-2xl font-black mt-4">Área do Afiliado</h2><p class="text-zinc-500 text-sm mt-2">Acesse seu painel</p></div><input id="loginAffEmail" type="email" class="input mb-3" placeholder="Seu e-mail"><input id="loginAffPassword" type="password" class="input mb-5" placeholder="Sua senha" onkeydown="if(event.key==='Enter') affiliateLogin()"><button onclick="affiliateLogin()" class="btn w-full bg-purple-600">ENTRAR</button><p class="text-center text-xs text-zinc-500 mt-5">Ainda não sou afiliado. <a href="#afiliado-cadastro" class="text-purple-400">Criar conta</a></p></div></section>`;}
function affiliateLogin(){const e=document.getElementById("loginAffEmail").value.trim(),p=document.getElementById("loginAffPassword").value,aff=affiliates.find(a=>a.email.toLowerCase()===e.toLowerCase()&&a.password===p);if(!aff){toast("E-mail ou senha incorretos.",true);return;}if(aff.status!=="Ativo"){toast("Conta bloqueada.",true);return;}currentAffiliate=aff.id;sessionStorage.setItem("rh_affiliate_id",aff.id);location.hash="afiliado-dashboard";}
function renderAffiliateDashboard(){const aff=affiliates.find(a=>a.id===currentAffiliate);if(!aff){location.hash="afiliado-login";return;}const myCom=commissions.filter(c=>c.affiliateId===aff.id);const pending=myCom.filter(c=>c.status==="Pendente").reduce((s,c)=>s+Number(c.amount),0);const approved=myCom.filter(c=>c.status==="Aprovada").reduce((s,c)=>s+Number(c.amount),0);const paid=myCom.filter(c=>c.status==="Paga").reduce((s,c)=>s+Number(c.amount),0);const refs=radios.filter(r=>r.afiliado===aff.code).length;const link=window.location.href.split("#")[0]+"?ref="+aff.code;document.getElementById("app").innerHTML=`<section class="max-w-7xl mx-auto px-5 py-10"><div class="flex flex-col md:flex-row justify-between gap-5 mb-8"><div><p class="text-xs text-purple-400 font-bold uppercase">Painel de afiliado</p><h1 class="text-3xl font-black mt-1">Olá, ${escapeHTML(aff.name)}</h1></div><button onclick="affiliateLogout()" class="btn border border-zinc-700"><i class="fa-solid fa-right-from-bracket mr-2"></i>Sair</button></div><div class="card p-6 mb-6"><p class="text-xs text-zinc-500 uppercase font-bold">Seu link exclusivo</p><div class="flex flex-col md:flex-row gap-3 mt-3"><input id="affiliateLink" readonly value="${link}" class="input text-purple-400"><button onclick="copyAffiliateLink()" class="btn bg-purple-600 md:w-40"><i class="fa-regular fa-copy mr-2"></i>Copiar</button></div><p class="text-xs text-zinc-600 mt-3">Código: ${aff.code}</p></div><div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">${affiliateStat("Indicações",refs,"fa-users","text-purple-400")}${affiliateStat("Pendente",money(pending),"fa-clock","text-yellow-400")}${affiliateStat("Aprovado",money(approved),"fa-circle-check","text-green-400")}${affiliateStat("Pago",money(paid),"fa-wallet","text-blue-400")}</div></section>`;}
function affiliateStat(t,v,i,c){return `<div class="stat"><div class="flex justify-between"><div><p class="text-xs text-zinc-500">${t}</p><strong class="text-2xl font-black block mt-1">${v}</strong></div><i class="fa-solid ${i} ${c} text-xl"></i></div></div>`;}
function requestWithdrawal(){const aff=affiliates.find(a=>a.id===currentAffiliate);if(!aff)return;const am=Number(document.getElementById("withdrawAmount").value),px=document.getElementById("withdrawPix").value.trim(),ap=commissions.filter(c=>c.affiliateId===aff.id&&c.status==="Aprovada").reduce((s,c)=>s+Number(c.amount),0);if(!am||am<=0){toast("Valor inválido.",true);return;}if(am>ap){toast("Saldo insuficiente.",true);return;}if(!px){toast("Informe PIX.",true);return;}withdrawals.push({id:id(),affiliateId:aff.id,amount:am,pix:px,status:"Solicitado",createdAt:new Date().toLocaleString("pt-BR")});let rem=am;commissions.forEach(c=>{if(c.affiliateId===aff.id&&c.status==="Aprovada"&&rem>0){const vv=Number(c.amount);if(vv<=rem){c.status="Paga";rem-=vv;}}});aff.pix=px;saveAll();toast("Saque solicitado.");renderAffiliateDashboard();}
function copyAffiliateLink(){const inp=document.getElementById("affiliateLink");navigator.clipboard.writeText(inp.value).then(()=>toast("Link copiado!"));}
function affiliateLogout(){sessionStorage.removeItem("rh_affiliate_id");currentAffiliate=null;location.hash="afiliado-login";}
function renderAdminLogin(){document.getElementById("app").innerHTML=`<section class="min-h-[75vh] flex items-center justify-center px-5"><div class="w-full max-w-md card p-7"><div class="text-center mb-7"><div class="w-16 h-16 mx-auto rounded-2xl bg-purple-600 flex items-center justify-center"><i class="fa-solid fa-lock text-xl"></i></div><h2 class="text-2xl font-black mt-4">Administração</h2></div><input id="adminEmail" class="input mb-3" type="email" placeholder="E-mail"><input id="adminPassword" class="input mb-5" type="password" placeholder="Senha" onkeydown="if(event.key==='Enter') adminLogin()"><button onclick="adminLogin()" class="btn w-full bg-purple-600">ENTRAR</button></div></section>`;}
function adminLogin(){const e=document.getElementById("adminEmail").value.trim(),p=document.getElementById("adminPassword").value;if(e===CONFIG.adminEmail&&p===CONFIG.adminPassword){sessionStorage.setItem("rh_admin","true");location.hash="admin-dashboard";}else{toast("Login inválido.",true);}}
function adminLogout(){sessionStorage.removeItem("rh_admin");location.hash="admin";}
function renderAdminDashboard(){if(sessionStorage.getItem("rh_admin")!=="true"){location.hash="admin";return;}const act=radios.filter(r=>r.status==="Ativa").length,pend=radios.filter(r=>r.status==="Aguardando confirmação").length;document.getElementById("app").innerHTML=`<section class="max-w-7xl mx-auto px-5 py-10"><div class="flex flex-col md:flex-row justify-between gap-5 mb-8"><div><p class="text-xs text-purple-400 uppercase font-bold">Painel administrativo</p><h1 class="text-3xl font-black">RádioHost</h1></div><button onclick="adminLogout()" class="btn border border-zinc-700">Sair</button></div><div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">${adminStat("Rádios",radios.length,"fa-radio")}${adminStat("Ativas",act,"fa-circle-check")}${adminStat("Pendentes",pend,"fa-clock")}${adminStat("Afiliados",affiliates.length,"fa-users")}</div></section>`;}
function adminStat(t,v,i){return `<div class="stat"><div class="flex justify-between"><div><p class="text-xs text-zinc-500">${t}</p><strong class="text-2xl font-black block mt-1">${v}</strong></div><i class="fa-solid ${i} text-purple-400"></i></div></div>`;}
function renderClientPanel(idR){const r=radios.find(x=>x.id===idR);if(!r){location.hash="home";return;}document.getElementById("app").innerHTML=`<section class="max-w-7xl mx-auto px-5 py-12"><div class="flex justify-between items-center mb-7"><div><p class="text-xs text-purple-400 uppercase font-bold">Painel da rádio</p><h1 class="text-3xl font-black">${escapeHTML(r.radio)}</h1></div><span class="bg-yellow-500/10 text-yellow-400 px-3 py-2 rounded-full text-xs">${escapeHTML(r.status)}</span></div><div class="grid md:grid-cols-3 gap-5"><div class="md:col-span-2 card p-6"><h3 class="font-black text-xl">Informações</h3><div class="grid sm:grid-cols-2 gap-4 mt-5"><div class="bg-black border border-zinc-800 rounded-xl p-4"><p class="text-xs text-zinc-500">Responsável</p><p class="font-bold text-sm mt-1">${escapeHTML(r.responsavel)}</p></div><div class="bg-black border border-zinc-800 rounded-xl p-4"><p class="text-xs text-zinc-500">E-mail</p><p class="font-bold text-sm mt-1">${escapeHTML(r.email)}</p></div><div class="bg-black border border-zinc-800 rounded-xl p-4"><p class="text-xs text-zinc-500">Plano</p><p class="font-bold text-sm mt-1">${escapeHTML(r.plano)}</p></div><div class="bg-black border border-zinc-800 rounded-xl p-4"><p class="text-xs text-zinc-500">Status</p><p class="font-bold text-sm mt-1">${escapeHTML(r.status)}</p></div></div></div><div class="card p-6"><div class="w-14 h-14 bg-purple-600 rounded-xl flex items-center justify-center text-xl"><i class="fa-solid fa-radio"></i></div><h3 class="font-black mt-5">Streaming</h3><p class="text-xs text-zinc-500 mt-1">radio.brazilianwave.com.br</p><button onclick="toggleRadio()" class="btn w-full bg-green-500 text-black mt-5">OUVIR RÁDIO</button></div></div></section>`;}
async function gerarVinheta(){const txt=document.getElementById("ttsText")?.value.trim();if(!txt){toast("Digite o texto da vinheta",true);return;}const btn=document.getElementById("ttsBtn"),st=document.getElementById("ttsStatus"),au=document.getElementById("ttsAudio");btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> GERANDO...';btn.disabled=true;st.textContent='Conectando na IA Gemini...';try{const r=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:txt})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Erro na IA');au.src=d.audio;au.classList.remove('hidden');au.play();st.textContent='Vinheta pronta!';toast('Vinheta gerada!');}catch(e){st.textContent='Erro: '+e.message;toast(e.message,true);}finally{btn.innerHTML='<i class="fa-solid fa-microphone"></i> GERAR LOCUÇÃO';btn.disabled=false;}}
function router(){const h=location.hash.replace("#","");if(h===""||h==="home")renderHome();else if(h==="admin")renderAdminLogin();else if(h==="admin-dashboard")renderAdminDashboard();else if(h==="afiliado-cadastro")renderAffiliateRegister();else if(h==="afiliado-login")renderAffiliateLogin();else if(h==="afiliado-dashboard")renderAffiliateDashboard();else if(h.startsWith("painel="))renderClientPanel(decodeURIComponent(h.substring(7)));else renderHome();window.scrollTo({top:0,behavior:"smooth"});}
window.addEventListener("hashchange",router);window.addEventListener("DOMContentLoaded",router);
document.addEventListener("click",e=>{const m=document.getElementById("paymentModal");if(e.target===m)closePayment();});
</script>
