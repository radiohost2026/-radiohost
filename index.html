<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RadioHost</title>
<style>body{margin:0;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:sans-serif}button{padding:20px 40px;font-size:22px;background:#ff0000;color:#fff;border:0;border-radius:50px}audio{width:90%;max-width:400px;margin-top:20px}</style>
</head>
<body>
<h1>🔴 RADIO AO VIVO</h1>
<button onclick="playRadio()">▶️ TOCAR</button>
<audio id="audio" controls></audio>
<script>
function playRadio(){
 const a=document.getElementById('audio');
 a.src='/radio/stream';
 a.play();
}
</script>
</body>
</html>
