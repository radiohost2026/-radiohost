    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"

    :root {
      --primary: #7c3aed;
      --cyan: #00f0ff;
      --pink: #ff2ea6;
      --green: #00ff88;
      --bg: #0f0f0f;
      --card: #18181b;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: white;
      font-family: Inter, Segoe UI, Roboto, Arial, sans-serif;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--green);
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% {
        opacity: 1;
      }

      50% {
        opacity: .3;
      }
    }

    .gradient-text {
      background: linear-gradient(
        90deg,
        var(--cyan),
        var(--pink)
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .glass {
      background: rgba(24, 24, 27, .75);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255,255,255,.08);
    }

    .recurso-item {
      background: #18181b;
      padding: 30px;
      border-radius: 16px;
      border: 1px solid #27272a;
      transition: .3s ease;
    }

    .recurso-item:hover {
      transform: translateY(-5px);
      border-color: var(--primary);
      box-shadow: 0 15px 30px rgba(124,58,237,.2);
    }

    .recurso-icon {
      font-size: 32px;
      color: var(--primary);
      margin-bottom: 18px;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal.active {
      display: flex;
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      background: #18181b;
      border: 1px solid #3f3f46;
      padding: 14px 18px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
      z-index: 999;
      transform: translateY(120px);
      opacity: 0;
      transition: .3s;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    input,
    select {
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #7c3aed !important;
      box-shadow: 0 0 0 2px rgba(124,58,237,.15);
    }

    .loader {
      width: 22px;
      height: 22px;
      border: 3px solid #ffffff30;
      border-top-color: white;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

  radioStream: "https://stream.zeno.fm/kmbjkezl7uetv"

/* =========================================================
   BANCO LOCAL
========================================================= */

let radios = JSON.parse(
  localStorage.getItem("rh_radios") || "[]"
);

let affiliates = JSON.parse(
  localStorage.getItem("rh_affiliates") || "[]"
);

let currentPlan = {
  name: "30 DIAS - R$30",
  value: 30
};

let topPlaying = false;


/* =========================================================
   HELPERS
========================================================= */

function saveData() {

  localStorage.setItem(
    "rh_radios",
    JSON.stringify(radios)
  );

  localStorage.setItem(
    "rh_affiliates",
    JSON.stringify(affiliates)
  );
}


function showToast(message, type = "success") {

  const toast = document.getElementById("toast");
  const text = document.getElementById("toastMessage");
  const icon = document.getElementById("toastIcon");

  text.textContent = message;

  if (type === "error") {
    icon.className = "fa-solid fa-circle-xmark text-red-400";
  } else {
    icon.className = "fa-solid fa-circle-check text-green-400";
  }

  toast.classList.add("show");

  setTimeout(() => {
    toast.classList.remove("show");
  }, 3000);
}


function formatMoney(value) {

  return Number(value).toLocaleString(
    "pt-BR",
    {
      style: "currency",
      currency: "BRL"
    }
  );
}


function generateId() {

  return Date.now().toString(36) +
    Math.random().toString(36).substring(2, 8);
}


function escapeHTML(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* =========================================================
   PLAYER
========================================================= */

function toggleTopPlay() {

  const player = document.getElementById("topPlayer");
  const icon = document.getElementById("iconTop");

  if (!topPlaying) {

    player.play()
      .then(() => {

        topPlaying = true;
        icon.className = "fa fa-pause text-xs";

      })
      .catch(() => {

        showToast(
          "Não foi possível iniciar o streaming.",
          "error"
        );

      });

  } else {

    player.pause();

    topPlaying = false;

    icon.className = "fa fa-play text-xs";
  }
}


/* =========================================================
   PLANOS
========================================================= */

function selectPlan(name, value) {

  currentPlan = {
    name,
    value: Number(value)
  };

  const planInput = document.getElementById("plano");
  const valueInput = document.getElementById("valor");

  if (planInput) {
    planInput.value = name;
  }

  if (valueInput) {
    valueInput.value = value;
  }

  showToast("Plano selecionado: " + name);

  document
    .getElementById("cadastro")
    ?.scrollIntoView({
      behavior: "smooth"
    });
}


/* =========================================================
   PAGAMENTO
========================================================= */

function openPayment() {

  const nome = document.getElementById("nome")?.value.trim();
  const pessoa = document.getElementById("pessoa")?.value.trim();
  const email = document.getElementById("email")?.value.trim();

  if (!nome || !pessoa || !email) {

    showToast(
      "Preencha nome da rádio, seu nome e e-mail.",
      "error"
    );

    return;
  }

  if (!email.includes("@")) {

    showToast(
      "Digite um e-mail válido.",
      "error"
    );

    return;
  }

  document.getElementById("paymentPlan").textContent =
    currentPlan.name;

  document.getElementById("paymentValue").textContent =
    formatMoney(currentPlan.value);

  document.getElementById("paymentModal")
    .classList.add("active");
}


function closePayment() {

  document
    .getElementById("paymentModal")
    .classList.remove("active");
}


function copyPix() {

  navigator.clipboard
    .writeText(CONFIG.pix)
    .then(() => {

      showToast(
        "Chave PIX copiada!"
      );

    })
    .catch(() => {

      showToast(
        "Não foi possível copiar automaticamente.",
        "error"
      );

    });
}


function confirmPayment() {

  const nome = document.getElementById("nome").value.trim();
  const pessoa = document.getElementById("pessoa").value.trim();
  const email = document.getElementById("email").value.trim();

  const radio = {
    id: generateId(),
    radio: nome,
    responsavel: pessoa,
    email,
    plano: currentPlan.name,
    valor: currentPlan.value,
    status: "Aguardando confirmação",
    criadoEm: new Date().toLocaleString("pt-BR")
  };

  radios.push(radio);

  saveData();

  closePayment();

  showToast(
    "Cadastro recebido! Aguarde a confirmação do pagamento."
  );

  setTimeout(() => {

    location.hash = "painel=" + radio.id;

  }, 1200);
}

/* =========================================================
   AFILIADO
========================================================= */

function updateAffiliateLink() {

  const input = document.getElementById("linkAfiliado");

  if (!input) return;

  const base =
    window.location.href.split("#")[0];

  const code =
    localStorage.getItem("rh_affiliate_code") ||
    generateId();

  localStorage.setItem(
    "rh_affiliate_code",
    code
  );

  input.value =
    base + "?ref=" + code;
}


function copyAffiliate() {

  const input =
    document.getElementById("linkAfiliado");

  navigator.clipboard
    .writeText(input.value)
    .then(() => {

      showToast(
        "Link de afiliado copiado!"
      );

    });
}

========================================================= */

}


function adminLogin() {

  const email =
    document.getElementById("adminEmail").value.trim();

  const password =
    document.getElementById("adminPass").value;

  if (
    email === CONFIG.adminEmail &&
    password === CONFIG.adminPassword
  ) {

    sessionStorage.setItem(
      "rh_admin",
      "true"
    );

    location.hash = "admin-dashboard";

  } else {

    showToast(
      "E-mail ou senha incorretos.",
      "error"
    );

  }
}


function adminLogout() {

  sessionStorage.removeItem("rh_admin");

  location.hash = "admin";
}


/* =========================================================

========================================================= */

function renderAdminDashboard() {

    r => r.status === "Ativa"

    (total, radio) => total + Number(radio.valor || 0),

  document.getElementById("app").innerHTML = `

      <div class="flex flex-col md:flex-row justify-between gap-5 mb-8">

          "Ativas",
          active,
          "fa-circle-check",
          "text-green-400"

          "Pendentes",
          pending,
          "fa-clock",
          "text-yellow-400"
        )}

          formatMoney(revenue),
          "fa-wallet",
          "text-blue-400"

        <div class="p-5 border-b border-zinc-800 flex justify-between items-center">

            Rádios cadastradas
          </h3>

          <span class="text-xs text-zinc-500">
            ${radios.length} cadastro(s)

        </div>


        ${
          radios.length === 0

          ? `
            <div class="p-10 text-center text-zinc-600">
              Nenhuma rádio cadastrada.

          `

              <table class="w-full text-sm">

                <thead class="bg-black/30">

                  <tr class="text-left text-xs text-zinc-500">

                    <th class="p-4">Rádio</th>
                    <th class="p-4">Responsável</th>
                    <th class="p-4">Plano</th>
                    <th class="p-4">Status</th>
                    <th class="p-4">Ações</th>

                  </tr>

                </thead>

                <tbody>

                  ${radios.map(radio => `

                    <tr class="border-t border-zinc-800">

                      <td class="p-4 font-bold">
                        ${escapeHTML(radio.radio)}
                      </td>

                      <td class="p-4 text-zinc-400">
                        ${escapeHTML(radio.responsavel)}
                        <br>
                        <span class="text-xs">
                          ${escapeHTML(radio.email)}
                        </span>
                      </td>

                      <td class="p-4">
                        ${escapeHTML(radio.plano)}
                      </td>

                      <td class="p-4">

                        <span class="px-2 py-1 rounded-full text-[10px] font-bold

                      <td class="p-4">

                        <div class="flex gap-2">

                    </tr>

                  `).join("")}

}


function adminStat(
  title,
  value,
  icon,
  color
) {

  return `

    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5">

      <div class="flex justify-between">

        <div>

          <p class="text-xs text-zinc-500">
            ${title}
          </p>

          <strong class="text-2xl font-black mt-1 block">
            ${value}
          </strong>

        </div>

        <i class="fa-solid ${icon} ${color} text-xl"></i>

      </div>

    </div>
  `;
}


function activateRadio(id) {

  const radio = radios.find(
    r => r.id === id
  );

  if (!radio) return;

  radio.status = "Ativa";

  saveData();

  showToast(
    "Rádio ativada com sucesso!"
  );

  renderAdminDashboard();
}


function deleteRadio(id) {

  if (
    !confirm(
      "Tem certeza que deseja excluir esta rádio?"
    )
  ) {
    return;
  }

  radios = radios.filter(
    r => r.id !== id
  );

  saveData();

  showToast(
    "Rádio excluída."
  );

  renderAdminDashboard();
}

          <h3 class="font-black text-lg mb-5">

          </h3>

          <div class="grid sm:grid-cols-2 gap-4">

            ${infoBox(
              "Responsável",
              radio.responsavel
            )}

            ${infoBox(
              "E-mail",
              radio.email
            )}

            ${infoBox(
              "Plano",
              radio.plano

            ${infoBox(
              "Cadastro",

          <h3 class="font-black">

          <p class="text-zinc-500 text-sm mt-2">

          <button

          <div>

            <p class="text-sm text-zinc-400 mt-1">

function infoBox(label, value) {

  return `

    <div class="bg-black border border-zinc-800 rounded-xl p-4">

      <p class="font-bold text-sm mt-1 break-words">
        ${escapeHTML(value)}
      </p>

    </div>
  `;
}


/* =========================================================
   ROTEADOR
========================================================= */

function router() {

  const hash =
    location.hash.replace("#", "");

  if (hash === "admin") {

    renderAdminLogin();

  } else if (hash === "admin-dashboard") {

    renderAdminDashboard();

  } else if (hash.startsWith("painel=")) {

    const id =
      decodeURIComponent(
        hash.substring("painel=".length)
      );

    renderPainel(id);

  } else {

    renderHome();

  }

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

window.addEventListener(
  "hashchange",
  router
);

window.addEventListener(
  "DOMContentLoaded",
  () => {

    router();

  }
);


/* =========================================================
   FECHAR MODAL CLICANDO FORA
========================================================= */

document.addEventListener(
  "click",
  event => {

    const modal =
      document.getElementById("paymentModal");

    if (
      event.target === modal
    ) {
      closePayment();
    }

  }
);

</script>
