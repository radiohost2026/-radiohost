<!DOCTYPE html>

<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">


  <title>RádioHost Premium</title>


  <script src="https://cdn.tailwindcss.com"></script>


  <link

    rel="stylesheet"

    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"

  >


  <style>

    :root {

      --purple: #7c3aed;

      --cyan: #00f0ff;

      --pink: #ff2ea6;

      --green: #00ff88;

      --bg: #0f0f0f;

    }


    * {

      box-sizing: border-box;

    }


    html {

      scroll-behavior: smooth;

    }


    body {

      margin: 0;

      background: var(--bg);

      color: white;

      font-family: Inter, Segoe UI, Roboto, Arial, sans-serif;

    }


    .dot {

      width: 8px;

      height: 8px;

      background: var(--green);

      border-radius: 50%;

      box-shadow: 0 0 8px var(--green);

      animation: blink 1s infinite;

    }


    @keyframes blink {

      0%,100% { opacity: 1; }

      50% { opacity: .3; }

    }


    .gradient-text {

      background: linear-gradient(90deg, var(--cyan), var(--pink));

      -webkit-background-clip: text;

      background-clip: text;

      color: transparent;

    }


    .card {

      background: #18181b;

      border: 1px solid #27272a;

      border-radius: 18px;

    }


    .input {

      width: 100%;

      background: #050505;

      border: 1px solid #27272a;

      border-radius: 12px;

      padding: 13px;

      color: white;

      outline: none;

    }


    .input:focus {

      border-color: var(--purple);

      box-shadow: 0 0 0 2px rgba(124,58,237,.15);

    }


    .btn {

      border-radius: 12px;

      padding: 12px 18px;

      font-weight: 800;

      transition: .2s;

    }


    .btn:hover {

      transform: translateY(-1px);

    }


    .modal {

      position: fixed;

      inset: 0;

      background: rgba(0,0,0,.78);

      display: none;

      align-items: center;

      justify-content: center;

      padding: 20px;

      z-index: 200;

    }


    .modal.active {

      display: flex;

    }


    .toast {

      position: fixed;

      right: 20px;

      bottom: 20px;

      z-index: 999;

      background: #18181b;

      border: 1px solid #3f3f46;

      padding: 14px 18px;

      border-radius: 12px;

      transform: translateY(120px);

      opacity: 0;

      transition: .3s;

    }


    .toast.show {

      transform: translateY(0);

      opacity: 1;

    }


    .stat {

      background: #18181b;

      border: 1px solid #27272a;

      border-radius: 18px;

      padding: 20px;

    }


    .resource {

      background: #18181b;

      border: 1px solid #27272a;

      padding: 25px;

      border-radius: 18px;

      transition: .25s;

    }


    .resource:hover {

      transform: translateY(-4px);

      border-color: var(--purple);

    }

  </style>

</head>


<body>


<!-- =========================================================

     HEADER

========================================================= -->


<header class="sticky top-0 z-50 bg-[#11111c]/95 backdrop-blur border-b border-[#27272a]">


  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">


    <a href="#home" class="flex items-center gap-3">


      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-400 to-pink-500 text-black font-black flex items-center justify-center">

        R

      </div>


      <div class="font-black text-lg">

        <span class="text-cyan-400">RÁDIO</span><span class="text-pink-500">HOST</span>

      </div>


    </a>


    <div class="flex items-center gap-3">


      <nav class="hidden md:flex gap-5 text-xs text-zinc-400">

        <a href="#home" class="hover:text-white">Início</a>

        <a href="#planos" class="hover:text-white">Planos</a>

        <a href="#afiliados" class="hover:text-white">Afiliados</a>

        <a href="#afiliado-login" class="hover:text-white">Área do Afiliado</a>

      </nav>


      <div class="flex items-center gap-2 bg-[#1a1a2e] border border-zinc-700 px-3 py-1.5 rounded-full">


        <div class="dot"></div>


        <button

          onclick="toggleRadio()"

          class="bg-green-500 text-black w-7 h-7 rounded-full"

        >

          <i id="topPlayIcon" class="fa-solid fa-play text-xs"></i>

        </button>


        <span class="text-[10px] font-bold text-green-400">

          AO VIVO

        </span>


      </div>


    </div>


  </div>


</header>



<audio id="radioPlayer">

  <source

    src="https://stream.zeno.fm/kmbjkezl7uetv"

    type="audio/mpeg"

  >

</audio>



<main id="app"></main>



<!-- =========================================================

     TOAST

========================================================= -->


<div id="toast" class="toast">


  <div class="flex items-center gap-3">


    <i id="toastIcon" class="fa-solid fa-circle-check text-green-400"></i>


    <span id="toastText">

      Mensagem

    </span>


  </div>


</div>
