<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RádioHost Premium</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
.dot{width:8px;height:8px;background:#00ff88;border-radius:50%;box-shadow:0 0 8px #00ff88;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body class="bg-[#0f0f0f] text-white">
<!-- TOPO COM PLAYER TOCANDO -->
<div class="sticky top-0 z-50 bg-[#11111c] border-b border-[#23233a] p-3">
<div class="max-w-7xl mx-auto flex justify-between items-center">
<div class="flex items-center gap-3">
<!-- SUA IMAGEM / LOGO - troca o src se quiser -->
<div class="w-10 h-10 rounded-lg bg-gradient-to-br from-[#00f0ff] to-[#ff2ea6] flex items-center justify-center font-black">R</div>
<h1 class="text-2xl font-black"><span class="text-[#00f0ff]">RÁDIO</span><span class="text-[#ff2ea6]">HOST</span></h1>
</div>
<div class="flex items-center gap-3 bg-[#1a1a2e] border border-zinc-700 px-3 py-1.5 rounded-full">
<div class="dot"></div><span class="text-[10px] font-bold text-[#00ff88]">TOCANDO</span>
<audio id="player" controls autoplay style="width:130px;height:28px">
<source src="https://stream.zeno.fm/kmbjkezl7uetv" type="audio/mpeg">
<source src="https://stream.zeno.fm/kmbjkezl7uetv.m3u" type="audio/x-mpegurl">
</audio>
</div>
</div>
</div>

<div id="app"></div>

<script>
const ADMIN_EMAIL = "admin@radiohost.com.br";
const ADMIN_PASS = "clans123";
const MEU_PIX = "radioclansweb@gmail.com";
let radios = JSON.parse(localStorage.getItem('rh_radios') || '[]');
let tempDados = JSON.parse(sessionStorage.getItem('rh_temp') || 'null');
function save(){ localStorage.setItem('rh_radios', JSON.stringify(radios)); }

function router(){
const path = window.location.pathname;
const hash = window.location.hash;
if(path.includes('/admin') || hash.includes('admin')){
if(hash.includes('admin-dashboard')) renderAdminDashboard(); else renderAdminLogin();
} else if(hash.includes('painel')){
const id = hash.split('=')[1]; renderPainel(id);
} else if(hash.includes('pagamento')){ renderPagamento(); }
else { renderHome(); }
}

function renderHome(){
document.getElementById('app').innerHTML = `
<header class="max-w-7xl mx-auto px-5 py-2 text-right"><span></span></header>
<section class="max-w-7xl mx-auto px-5 py-8 grid md:grid-cols-2 gap-10 items-center">
<div>
<div class="inline-block bg-purple-600/20 text-purple-400 px-3 py-1 rounded-full text-xs mb-4">DEMONSTRAÇÃO AO VIVO - PLAYER NO TOPO</div>
<h2 class="text-5xl font-black leading-tight">SEU STREAMING<br><span class="text-purple-500">PROFISSIONAL</span></h2>
<p class="text-zinc-400 text-sm mt-3">Player oficial tocando no topo: https://stream.zeno.fm/kmbjkezl7uetv.m3u</p>
<div class="grid grid-cols-3 gap-3 mt-8">
<div class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl text-center"><p class="font-bold text-xl">R$20</p><p class="text-xs text-zinc-500">15 DIAS<br>100 Ouv.</p><button onclick="selectPlan('15 DIAS - R$20','20')" class="mt-2 w-full bg-zinc-800 py-1.5 rounded text-xs">Escolher</button></div>
<div class="bg-purple-600 p-4 rounded-xl text-center border-2 border-purple-400"><p class="font-bold text-xl">R$30</p><p class="text-xs">30 DIAS<br>500 Ouv.</p><button onclick="selectPlan('30 DIAS - R$30','30')" class="mt-2 w-full bg-white text-purple-600 py-1.5 rounded text-xs font-bold">Escolher</button></div>
<div class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl text-center"><p class="font-bold text-xl">R$600</p><p class="text-xs text-zinc-500">12 MESES<br>ILIMITADO</p><button onclick="selectPlan('12 MESES - R$600','600')" class="mt-2 w-full bg-zinc-800 py-1.5 rounded text-xs">Escolher</button></div>
</div>
</div>
<div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6">
<h3 class="font-bold text-lg mb-4">CRIAR MINHA RÁDIO</h3>
<input id="nome" class="w-full bg-black border border-zinc-800 rounded p-3 mb-3" placeholder="Nome da Rádio">
<input id="pessoa" class="w-full bg-black border border-zinc-800 rounded p-3 mb-3" placeholder="Seu Nome">
<input id="email" class="w-full bg-black border border-zinc-800 rounded p-3 mb-3" placeholder="Seu E-mail">
<input id="plano" class="w-full bg-black border border-zinc-800 rounded p-3 mb-1" value="30 DIAS - R$30" readonly>
<input id="valor" type="hidden" value="30">
<p class="text-[10px] text-zinc-500 mb-4">Acesso ao painel só após PIX para ${MEU_PIX}</p>
<button onclick="irPagamento()" class="w-full bg-green-500 text-black font-black py-3 rounded-xl">IR PARA PAGAMENTO PIX</button>
</div>
</section>`;
}

function selectPlan(p,v){ document.getElementById('plano').value=p; document.getElementById('valor').value=v; }

function irPagamento(){
const nome=document.getElementById('nome').value;
const pessoa=document.getElementById('pessoa').value;
const email=document.getElementById('email').value;
const plano=document.getElementById('plano').value;
const valor=document.getElementById('valor').value;
if(!nome||!pessoa||!email){ alert('Preencha Nome da Rádio, Seu Nome e Email'); return; }
tempDados={nome,pessoa,email,plano,valor};
sessionStorage.setItem('rh_temp', JSON.stringify(tempDados));
location.hash='pagamento';
router();
}

function renderPagamento(){
if(!tempDados){ renderHome(); return; }
const qrData = encodeURIComponent(MEU_PIX);
document.getElementById('app').innerHTML=`
<div class="max-w-lg mx-auto p-5">
<div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 text-center">
<h2 class="text-2xl font-black">PAGAMENTO VIA PIX</h2>
<p class="text-sm text-zinc-400 mt-2">Rádio: <b class="text-purple-400">${tempDados.nome}</b><br>Plano: ${tempDados.plano} - <b class="text-green-400">R$${tempDados.valor}</b></p>

<div class="bg-white p-3 rounded-xl mt-5 mx-auto w-56">
<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${qrData}" class="w-full">
<p class="text-black text-[10px] mt-2 font-bold">PIX: ${MEU_PIX}</p>
</div>

<div class="bg-black border border-zinc-800 p-3 rounded mt-4 text-left">
<p class="text-[10px] text-zinc-500">CHAVE PIX EMAIL (copia e cola):</p>
<p class="text-sm font-bold break-all text-green-400 select-all">${MEU_PIX}</p>
<button onclick="navigator.clipboard.writeText('${MEU_PIX}');alert('PIX ${MEU_PIX} copiado!')" class="mt-2 w-full bg-zinc-800 py-2 rounded text-xs"><i class="fa fa-copy"></i> COPIAR CHAVE PIX</button>
</div>

<button onclick="confirmarPagamento()" class="w-full bg-green-500 text-black font-black py-3 rounded-xl mt-5">JÁ PAGUEI, LIBERAR MINHA RÁDIO</button>
<p class="text-[10px] text-zinc-500 mt-2">Após fazer o PIX para ${MEU_PIX}, clique acima e seu painel será liberado automaticamente.</p>
<a href="/" class="text-xs text-zinc-500 mt-4 inline-block">Voltar</a>
</div>
</div>`;
}

function confirmarPagamento(){
if(!tempDados) return;
const id=Date.now().toString();
radios.push({id,nome:tempDados.nome,pessoa:tempDados.pessoa,email:tempDados.email,plano:tempDados.plano,valor:tempDados.valor,data:new Date().toLocaleString(),status:'pago',ouvintes:Math.floor(Math.random()*40+5)});
save();
sessionStorage.removeItem('rh_temp');
tempDados=null;
location.hash='painel='+id;
router();
}

function renderPainel(id){
const r=radios.find(x=>x.id==id)||radios[0];
if(!r){ renderHome(); return; }
document.getElementById('app').innerHTML=`
<div class="p-5 max-w-4xl mx-auto">
<div class="bg-zinc-900 border border-zinc-800 rounded-xl p-5">
<h3 class="font-bold text-xl">Bem-vindo, ${r.pessoa}!</h3>
<p class="text-sm text-zinc-400">Sua rádio <b class="text-purple-400">${r.nome}</b> - <b class="text-green-400">${r.plano}</b></p>
<div class="bg-green-900/30 border border-green-700 p-3 rounded mt-4 text-sm">✅ PAGAMENTO CONFIRMADO - ${MEU_PIX}<br>STATUS: <span class="text-green-400 font-bold">● AO VIVO 24H</span> | Ouvintes: ${r.ouvintes} | AutoDJ: ON</div>
<div class="border-2 border-dashed border-zinc-700 rounded-xl p-10 text-center mt-4">
<i class="fa fa-music text-3xl text-zinc-600 mb-2"></i><p>Arraste suas músicas MP3 aqui - AutoDJ Ativo</p><p class="text-xs text-zinc-500 mt-2">Link do seu streaming: https://stream.zeno.fm/kmbjkezl7uetv</p>
</div>
<a href="/" class="text-xs text-zinc-500 mt-4 block">Voltar ao site</a>
</div>
</div>`;
}

function renderAdminLogin(){
document.getElementById('app').innerHTML=`
<div class="min-h-[80vh] flex items-center justify-center p-5">
<div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-8 w-full max-w-sm">
<h2 class="text-2xl font-black text-center mb-2">LOGIN ADM</h2><p class="text-center text-xs text-zinc-500 mb-6">/admin</p>
<input id="adm_email" class="w-full bg-black border border-zinc-800 rounded p-3 mb-3" value="admin@radiohost.com.br">
<input id="adm_pass" type="password" class="w-full bg-black border border-zinc-800 rounded p-3 mb-4" placeholder="clans123">
<button onclick="doAdminLogin()" class="w-full bg-purple-600 font-bold py-3 rounded-xl">ENTRAR</button>
<p id="err" class="text-red-400 text-xs mt-3 text-center hidden">Senha incorreta</p>
</div></div>`;
}
function doAdminLogin(){
const e=document.getElementById('adm_email').value;
const p=document.getElementById('adm_pass').value;
if(e===ADMIN_EMAIL&&p===ADMIN_PASS){ localStorage.setItem('rh_admin','logado'); location.hash='admin-dashboard'; router(); }
else { document.getElementById('err').classList.remove('hidden'); }
}
function renderAdminDashboard(){
if(localStorage.getItem('rh_admin')!=='logado'){ renderAdminLogin(); return; }
let fat=radios.reduce((a,b)=>a+parseInt(b.valor||30),0);
let ouv=radios.reduce((a,b)=>a+b.ouvintes,0);
document.getElementById('app').innerHTML=`
<div class="max-w-6xl mx-auto p-5">
<h2 class="text-2xl font-black mb-1">#admin-dashboard - PAINEL ADMINISTRATIVO</h2><p class="text-xs text-zinc-500 mb-6">Faturamento e lista de clientes</p>
<div class="grid grid-cols-3 gap-3 mb-6">
<div class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl"><p class="text-xs text-zinc-500">Total Rádios</p><p class="text-2xl font-bold">${radios.length}</p></div>
<div class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl"><p class="text-xs text-zinc-500">Faturamento</p><p class="text-2xl font-bold text-green-400">R$${fat}</p></div>
<div class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl"><p class="text-xs text-zinc-500">Ouvintes Online</p><p class="text-2xl font-bold">${ouv}</p></div>
</div>
<div class="bg-zinc-900 border border-zinc-800 rounded-xl overflow-auto">
<table class="w-full text-sm"><thead class="bg-black text-zinc-500 text-xs"><tr><th class="p-3 text-left">Rádio</th><th class="p-3">Cliente / Email</th><th class="p-3">Plano / Valor</th><th class="p-3">Ação</th></tr></thead>
<tbody>${radios.map(r=>`<tr class="border-t border-zinc-800"><td class="p-3 font-bold">${r.nome}<br><span class="text-[10px] text-zinc-500">${r.data}</span></td><td class="p-3">${r.pessoa}<br><span class="text-xs text-purple-400">${r.email}</span></td><td class="p-3 text-green-400">${r.plano}<br>R$${r.valor}</td><td class="p-3"><button onclick="location.hash='painel=${r.id}';router()" class="bg-white text-black px-3 py-1 rounded text-xs">Ver Painel</button></td></tr>`).join('')||'<tr><td colspan=4 class="p-6 text-center text-zinc-500">Nenhuma rádio criada ainda</td></tr>'}</tbody></table>
</div>
<a href="/" class="text-xs text-zinc-500 mt-4 block">Voltar ao site</a>
</div>`;
}
window.addEventListener('hashchange',router); router();
</script>
</body>
</html>
