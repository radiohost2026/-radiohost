<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RadioHost Premium</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
.dot{width:8px;height:8px;background:#00ff88;border-radius:50%;box-shadow:0 0 8px #00ff88;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.recursos-radio{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;padding:40px 20px;max-width:1200px;margin:0 auto}
.recurso-item{background:#18181b;padding:30px;border-radius:16px;border:1px solid #27272a}
</style>
</head>
<body class="bg-[#0f0f0f] text-white">
<div class="sticky top-0 z-50 bg-[#11111c] border-b border-zinc-800 p-3 flex justify-between items-center">
<div class="flex items-center gap-2"><div class="w-8 h-8 bg-gradient-to-br from-cyan-400 to-pink-500 rounded flex items-center justify-center font-black">R</div><h1 class="font-black">RADIOHOST</h1></div>
<div class="flex gap-2"><a href="#afiliados" class="bg-purple-600 px-3 py-1 rounded-full text-xs">AFILIADOS 20%</a><div class="flex items-center gap-2 bg-zinc-900 border border-zinc-700 px-3 py-1 rounded-full"><div class="dot"></div><span class="text-[10px] text-green-400">AO VIVO</span></div></div>
</div>
<div id="app"></div>
<script>
const MEU_PIX="radioclansweb@gmail.com";
let radios=JSON.parse(localStorage.getItem('rh_radios')||'[]');
let afiliados=JSON.parse(localStorage.getItem('rh_afiliados')||'[]');
let tempDados=JSON.parse(sessionStorage.getItem('rh_temp')||'null');
function save(){localStorage.setItem('rh_radios',JSON.stringify(radios))}
function saveAf(){localStorage.setItem('rh_afiliados',JSON.stringify(afiliados))}
function getRef(){const p=new URLSearchParams(location.search);const r=p.get('ref');if(r){sessionStorage.setItem('rh_ref',r)}return sessionStorage.getItem('rh_ref')}
function router(){getRef();const h=location.hash;if(h.includes('afiliado-painel=')) renderPainelAf(h.split('=')[1]);else if(h.includes('afiliados')) renderAfiliados();else if(h.includes('pagamento')) renderPagamento();else renderHome()}
function selectPlan(p,v){document.getElementById('plano').value=p;document.getElementById('valor').value=v}
function renderHome(){
const ref=getRef();
document.getElementById('app').innerHTML=`<div class="max-w-6xl mx-auto p-5">
<h1 class="text-4xl font-black">SEU STREAMING PROFISSIONAL</h1>
${ref?`<div class="bg-green-500/20 text-green-400 p-2 rounded mt-2 text-xs">Indicado por ${ref} - ele ganhara 20%</div>`:''}
<div class="grid grid-cols-3 gap-3 mt-6 max-w-xl">
<div class="bg-zinc-900 p-4 rounded text-center">R$20<br><button onclick="selectPlan('15 DIAS - R$20','20')" class="bg-zinc-800 px-3 py-1 rounded text-xs mt-2">Escolher</button></div>
<div class="bg-purple-600 p-4 rounded text-center">R$30<br><button onclick="selectPlan('30 DIAS - R$30','30')" class="bg-white text-purple-600 px-3 py-1 rounded text-xs mt-2">Escolher</button></div>
<div class="bg-zinc-900 p-4 rounded text-center">R$600<br><button onclick="selectPlan('12 MESES - R$600','600')" class="bg-zinc-800 px-3 py-1 rounded text-xs mt-2">Escolher</button></div>
</div>
<div class="mt-6 bg-zinc-900 p-5 rounded-2xl max-w-xl">
<input id="nome" placeholder="Nome Radio" class="w-full bg-black border border-zinc-800 p-3 mb-2 rounded">
<input id="pessoa" placeholder="Seu Nome" class="w-full bg-black border border-zinc-800 p-3 mb-2 rounded">
<input id="email" placeholder="Email" class="w-full bg-black border border-zinc-800 p-3 mb-2 rounded">
<input id="plano" value="30 DIAS - R$30" readonly class="w-full bg-black border border-zinc-800 p-3 mb-2 rounded">
<input id="valor" type="hidden" value="30">
<button onclick="irPagamento()" class="w-full bg-green-500 text-black font-black py-3 rounded">IR PARA PAGAMENTO PIX</button>
</div>
<div class="mt-10 bg-[#11111c] border border-purple-900/40 rounded-3xl p-8">
<h2 class="text-2xl font-black">Opcao de afiliados</h2>
<h3 class="text-lg text-purple-300 mt-2">Painel de afiliados onde cada afiliado vai obter um link exclusivo para divulgar e convidar pessoas</h3>
<p class="text-sm text-zinc-300 mt-4">Voce promove os nossos servicos atraves de um link exclusivo e ganha uma comissao recorrente de 20% do plano que assinarem atraves da sua indicacao.<br>A comissao e recorrente, voce recebe todo mes enquanto seu indicado permanecer nosso cliente.<br>A comissao entra em seu cadastro 8 dias automaticamente apos o cliente efetuar o pagamento do plano podendo resgatar ou trocar por preco de pacote mensal de funcionamento da radio hospedada<br>Ou se o afiliado optar so para divulgacao de afiliado e nao tiver a propria radio cadastrada na radiohost ele pode optar em sacar o dinheiro da comissao via pix</p>
<h3 class="font-black mt-6">Como funciona - 20% de Comissao Recorrente</h3>
<p class="text-sm mt-2">Veja um Exemplo - Veja abaixo os servicos comissionados e um exemplo do valor de comissao recebido</p>
<div class="grid md:grid-cols-3 gap-4 mt-6">
<div class="bg-zinc-950 border border-zinc-800 p-4 rounded"><b class="text-green-400">R$ 20,00 (15 Dias)</b><br><span class="text-xs">• Comissao por ciclo (15 dias): 20% de R$ 20,00 = R$ 4,00<br>• Mensal (2 ciclos): R$ 8,00/mes<br>• Anual (24 ciclos): R$ 96,00/Ano</span></div>
<div class="bg-zinc-950 border border-zinc-800 p-4 rounded"><b class="text-green-400">R$ 30,00 (30 Dias)</b><br><span class="text-xs">• Mensal: 20% de R$ 30,00 = R$ 6,00/mes<br>• Anual: R$ 72,00/Ano</span></div>
<div class="bg-zinc-950 border border-zinc-800 p-4 rounded"><b class="text-green-400">R$ 600,00 (12 meses)</b><br><span class="text-xs">• Anual: 20% de R$ 600,00 = R$ 120,00/Ano<br>• Mensal: R$ 10,00/mes</span></div>
</div>
<div class="mt-6"><a href="#afiliados" class="bg-purple-600 px-6 py-3 rounded font-bold">QUERO SER AFILIADO GRATIS</a></div>
</div>
</div>`;
}
function irPagamento(){const nome=document.getElementById('nome').value,pessoa=document.getElementById('pessoa').value,email=document.getElementById('email').value,plano=document.getElementById('plano').value,valor=document.getElementById('valor').value;if(!nome||!pessoa||!email){alert('preencha');return}tempDados={nome,pessoa,email,plano,valor,ref:sessionStorage.getItem('rh_ref')||''};sessionStorage.setItem('rh_temp',JSON.stringify(tempDados));location.hash='pagamento';router()}
function renderPagamento(){if(!tempDados){renderHome();return}document.getElementById('app').innerHTML=`<div class="max-w-lg mx-auto p-5 text-center"><div class="bg-zinc-900 p-6 rounded-2xl"><h2>PAGAMENTO PIX ${MEU_PIX}</h2><p>${tempDados.nome} - ${tempDados.plano} R$${tempDados.valor} ${tempDados.ref?`Indicado por ${tempDados.ref}`:''}</p><div class="bg-white p-3 rounded mt-4"><img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${MEU_PIX}" class="w-full"></div><button onclick="confirmarPagamento()" class="w-full bg-green-500 text-black font-black py-3 rounded mt-4">JA PAGUEI - LIBERAR</button></div></div>`}
function confirmarPagamento(){if(!tempDados)return;const id=Date.now().toString();const v=parseFloat(tempDados.valor)||30;radios.push({id,nome:tempDados.nome});save();if(tempDados.ref){let af=afiliados.find(a=>a.codigo===tempDados.ref);if(af){let lib=new Date();lib.setDate(lib.getDate()+8);af.comissoes=af.comissoes||[];af.comissoes.push({radioNome:tempDados.nome,valorPlano:v,valorComissao:v*0.2,dataVenda:new Date().toLocaleDateString(),dataLiberacao:lib.toLocaleDateString(),dataLiberacaoTS:lib.getTime(),status:'pendente'});saveAf()}}sessionStorage.removeItem('rh_temp');alert('Radio liberada! Afiliado ganhou 20%');location.hash='';router()}
function renderAfiliados(){let meuId=localStorage.getItem('rh_meu_afiliado');let meu=afiliados.find(a=>a.id===meuId);document.getElementById('app').innerHTML=`<div class="max-w-5xl mx-auto p-5"><h2 class="text-2xl font-black">PROGRAMA DE AFILIADOS - 20% RECORRENTE</h2><p class="text-sm text-zinc-400 mt-2">Voce promove os nossos servicos atraves de um link exclusivo e ganha 20% recorrente. Comissao libera em 8 dias. Pode trocar por credito de radio ou sacar via PIX se nao tiver radio.</p><div class="mt-6 bg-zinc-900 p-6 rounded-2xl">${meu?`<p>Ola ${meu.nome} - Codigo: <b class="text-purple-400">${meu.codigo}</b></p><div class="bg-black p-3 rounded mt-3"><p class="text-xs text-zinc-500">SEU LINK EXCLUSIVO</p><input value="${location.origin+location.pathname}?ref=${meu.codigo}" class="w-full bg-zinc-900 p-2 text-xs mt-1" readonly></div><button onclick="location.hash='afiliado-painel=${meu.id}';router()" class="w-full bg-green-500 text-black font-black py-3 rounded mt-4">MEU PAINEL DE COMISSOES</button><button onclick="localStorage.removeItem('rh_meu_afiliado');location.hash='afiliados';router()" class="bg-zinc-800 px-3 py-1 rounded text-xs mt-2">Sair</button>`: `<input id="af_nome" placeholder="Seu nome completo" class="w-full bg-black border border-zinc-800 p-3 mb-2 rounded"><input id="af_email" placeholder="Email" class="w-full bg-black border border-zinc-800 p-3 mb-2 rounded"><input id="af_pix" placeholder="Chave PIX" class="w-full bg-black border border-zinc-800 p-3 mb-2 rounded"><button onclick="criarAfiliado()" class="w-full bg-purple-600 py-3 rounded font-bold">GERAR MEU LINK DE AFILIADO</button>`}</div><div class="grid md:grid-cols-3 gap-4 mt-6"><div class="bg-black/50 p-4 rounded border border-zinc-800"><b>R$20</b><br><span class="text-xs">R$4 por ciclo / R$8 mes / R$96 ano</span></div><div class="bg-black/50 p-4 rounded border border-zinc-800"><b>R$30</b><br><span class="text-xs">R$6 mes / R$72 ano</span></div><div class="bg-black/50 p-4 rounded border border-zinc-800"><b>R$600</b><br><span class="text-xs">R$120 ano / R$10 mes</span></div></div></div>`}
function criarAfiliado(){const nome=document.getElementById('af_nome').value,email=document.getElementById('af_email').value,pix=document.getElementById('af_pix').value;if(!nome||!email||!pix){alert('preencha');return}const codigo=nome.substring(0,4).toUpperCase().replace(/[^A-Z]/g,'')+Math.floor(100+Math.random()*900);const id=Date.now().toString();afiliados.push({id,nome,email,pix,codigo,comissoes:[]});saveAf();localStorage.setItem('rh_meu_afiliado',id);alert('Codigo: '+codigo);location.hash='afiliados';router()}
function renderPainelAf(id){const af=afiliados.find(a=>a.id===id);if(!af){renderAfiliados();return}let agora=Date.now();af.comissoes.forEach(c=>{if(c.status==='pendente'&&agora>=c.dataLiberacaoTS)c.status='liberada'});saveAf();let lib=af.comissoes.filter(c=>c.status==='liberada');let totLib=lib.reduce((a,b)=>a+b.valorComissao,0);document.getElementById('app').innerHTML=`<div class="max-w-5xl mx-auto p-5"><h2>Painel ${af.nome} - ${af.codigo}</h2><p>Saldo liberado: R$ ${totLib.toFixed(2)}</p><p>Link: ${location.origin+location.pathname}?ref=${af.codigo}</p><p class="mt-4">PIX: ${af.pix}</p><div class="mt-4"><button onclick="usarCredito('${af.id}')" class="bg-zinc-800 px-4 py-2 rounded">TROCAR POR CREDITO RADIO</button><button onclick="sacarPix('${af.id}')" class="bg-green-600 text-black px-4 py-2 rounded ml-2">SACAR VIA PIX</button></div><div class="mt-6">${af.comissoes.map(c=>`<div class="bg-zinc-900 p-2 rounded mb-2 text-xs">${c.radioNome} - R$${c.valorComissao.toFixed(2)} - ${c.status} - Libera ${c.dataLiberacao}</div>`).join('')||'Nenhuma indicacao'}</div></div>`}
function usarCredito(id){let af=afiliados.find(a=>a.id===id);let lib=af.comissoes.filter(c=>c.status==='liberada');let tot=lib.reduce((a,b)=>a+b.valorComissao,0);if(tot<=0){alert('sem saldo');return}lib.forEach(c=>c.status='usada_credito');saveAf();alert('Credito R$'+tot.toFixed(2)+' aplicado');renderPainelAf(id)}
function sacarPix(id){let af=afiliados.find(a=>a.id===id);let lib=af.comissoes.filter(c=>c.status==='liberada');let tot=lib.reduce((a,b)=>a+b.valorComissao,0);if(tot<20){alert('Minimo R$20, tem R$'+tot.toFixed(2));return}lib.forEach(c=>c.status='sacada');saveAf();alert('Saque R$'+tot.toFixed(2)+' para '+af.pix);renderPainelAf(id)}
window.addEventListener('hashchange',router);router();
</script>
</body>
</html>
