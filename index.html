<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RadioHost Premium</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>.dot{width:8px;height:8px;background:#00ff88;border-radius:50%;box-shadow:0 0 8px #00ff88;animation:blink 1s infinite}@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}</style>
</head>
<body class="bg-[#0a0a0f] text-white">
<div class="sticky top-0 z-50 bg-[#11111c] border-b border-[#23233a] p-3 flex justify-between items-center">
<div class="flex items-center gap-2">
<div class="w-10 h-10 rounded-lg bg-gradient-to-br from-[#00f0ff] to-[#ff2ea6] flex items-center justify-center">📡</div>
<h1 class="text-lg font-black"><span class="text-[#00f0ff]">RÁDIO</span><span class="text-[#ff2ea6]">HOST</span></h1>
</div>
<div class="flex items-center gap-2 bg-[#1a1a2e] border border-zinc-700 px-2 py-1 rounded-full">
<div class="dot"></div><span class="text-[9px] font-bold text-[#00ff88]">TOCANDO</span>
<audio controls autoplay style="width:110px;height:26px" src="https://stream.zeno.fm/kmbjkezl7uetv"></audio>
</div>
</div>
<div id="app"></div>
<script>
const ADMIN_EMAIL="admin@radiohost.com.br",ADMIN_PASS="clans123";
const MEU_PIX="radioclansweb@gmail.com";
let radios=JSON.parse(localStorage.getItem('rh_radios')||'[]');
let tempDados=null;
function save(){localStorage.setItem('rh_radios',JSON.stringify(radios))}
function router(){const h=location.hash,p=location.pathname;if(p.includes('admin')||h.includes('admin')){if(h.includes('admin-dashboard'))renderAdminDashboard();else renderAdminLogin()}else if(h.includes('painel'))renderPainel(h.split('=')[1]);else if(h.includes('pagamento'))renderPagamento();else renderHome()}
function renderHome(){document.getElementById('app').innerHTML=`<section class="max-w-7xl mx-auto px-5 py-6 grid md:grid-cols-2 gap-10"><div><div class="inline-block bg-purple-600/20 text-purple-400 px-3 py-1 rounded-full text-xs mb-4">AO VIVO</div><h2 class="text-5xl font-black">SEU STREAMING<br><span class="text-purple-500">PROFISSIONAL</span></h2><div class="grid grid-cols-3 gap-3 mt-8"><div class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl text-center"><p class="font-bold">R$20</p><p class="text-xs text-zinc-500">15 DIAS</p><button onclick="selectPlan('15 DIAS - R$20','20')" class="mt-2 w-full bg-zinc-800 py-1 rounded text-xs">Escolher</button></div><div class="bg-purple-600 p-4 rounded-xl text-center border-2 border-purple-400"><p class="font-bold">R$30</p><p class="text-xs">30 DIAS</p><button onclick="selectPlan('30 DIAS - R$30','30')" class="mt-2 w-full bg-white text-purple-600 py-1 rounded text-xs font-bold">Escolher</button></div><div class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl text-center"><p class="font-bold">R$600</p><p class="text-xs text-zinc-500">12 MESES</p><button onclick="selectPlan('12 MESES - R$600','600')" class="mt-2 w-full bg-zinc-800 py-1 rounded text-xs">Escolher</button></div></div></div><div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6"><h3 class="font-bold mb-4">CRIAR MINHA RÁDIO</h3><input id="nome" class="w-full bg-black border border-zinc-800 rounded p-3 mb-3" placeholder="Nome da Rádio"><input id="pessoa" class="w-full bg-black border border-zinc-800 rounded p-3 mb-3" placeholder="Seu Nome"><input id="email" class="w-full bg-black border border-zinc-800 rounded p-3 mb-3" placeholder="Seu E-mail"><input id="plano" class="w-full bg-black border border-zinc-800 rounded p-3 mb-2" value="30 DIAS - R$30" readonly><input id="valor" type="hidden" value="30"><button onclick="irParaPagamento()" class="w-full bg-green-500 text-black font-black py-3 rounded-xl">IR PARA PAGAMENTO</button><p class="text-[10px] text-zinc-500 mt-2 text-center">Só libera após pagamento via PIX: radioclansweb@gmail.com</p></div></section>`}
function selectPlan(p,v){document.getElementById('plano').value=p;document.getElementById('valor').value=v}
function irParaPagamento(){const n=document.getElementById('nome').value,pe=document.getElementById('pessoa').value,e=document.getElementById('email').value,pl=document.getElementById('plano').value,va=document.getElementById('valor').value;if(!n||!pe||!e){alert('Preencha tudo');return}tempDados={nome:n,pessoa:pe,email:e,plano:pl,valor:va};location.hash='pagamento';router()}
function renderPagamento(){if(!tempDados){renderHome();return}document.getElementById('app').innerHTML=`<div class="max-w-lg mx-auto p-5"><div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 text-center"><h2 class="text-2xl font-black mb-2">PAGAMENTO PIX</h2><p class="text-sm text-zinc-400">Rádio: <b class="text-purple-400">${tempDados.nome}</b> - ${tempDados.plano}</p><div class="bg-white p-4 rounded-xl mt-4 mx-auto w-56 h-56 flex items-center justify-center text-black text-xs font-bold">PIX R$${tempDados.valor}<br><br>radioclansweb@gmail.com<br><br>QR CODE PIX</div><div class="bg-black border border-zinc-800 p-3 rounded mt-4 text-left"><p class="text-[10px] text-zinc-500">CHAVE PIX EMAIL (copia e cola):</p><p class="text-sm font-bold break-all select-all">${MEU_PIX}</p><button onclick="navigator.clipboard.writeText('${MEU_PIX}');alert('PIX radioclansweb@gmail.com copiado!')" class="mt-2 w-full bg-zinc-800 py-2 rounded text-xs">COPIAR CHAVE PIX</button></div><button onclick="confirmarPagamento()" class="w-full bg-green-500 text-black font-black py-3 rounded-xl mt-4">JÁ PAGUEI, LIBERAR MINHA RÁDIO</button><p class="text-[10px] text-zinc-500 mt-2">Após pagar para radioclansweb@gmail.com, clique acima.</p><a href="/" class="text-xs text-zinc-500 mt-4 inline-block">Voltar</a></div></div>`}
function confirmarPagamento(){if(!tempDados)return;const id=Date.now().toString();radios.push({id,nome:tempDados.nome,pessoa:tempDados.pessoa,email:tempDados.email,plano:tempDados.plano,valor:tempDados.valor,ouvintes:Math.floor(Math.random()*40+5),status:'pago'});save();tempDados=null;location.hash='painel='+id;router()}
function renderPainel(id){const r=radios.find(x=>x.id==id)||radios[0];if(!r){renderHome();return}document.getElementById('app').innerHTML=`<div class="p-5 max-w-4xl mx-auto"><div class="bg-zinc-900 border border-zinc-800 rounded-xl p-5"><h3 class="font-bold text-xl">Bem-vindo, ${r.pessoa}!</h3><p>Sua rádio <b class="text-purple-400">${r.nome}</b> - ${r.plano}</p><div class="bg-green-900/30 border border-green-700 p-3 rounded mt-4">✅ PAGAMENTO CONFIRMADO PARA ${MEU_PIX} - STATUS: <b class="text-green-400">● AO VIVO 24H</b> | Ouvintes: ${r.ouvintes}</div><div class="border-2 border-dashed border-zinc-700 rounded-xl p-10 text-center mt-4">Arraste MP3 aqui - AutoDJ Ativo</div><a href="/" class="text-xs text-zinc-500 mt-4 inline-block">Voltar</a></div></div>`}
function renderAdminLogin(){document.getElementById('app').innerHTML=`<div class="min-h-[80vh] flex items-center justify-center p-5"><div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-8 w-full max-w-sm"><h2 class="text-2xl font-black text-center mb-6">LOGIN ADMIN</h2><input id="adm_email" class="w-full bg-black border border-zinc-800 rounded p-3 mb-3" value="admin@radiohost.com.br"><input id="adm_pass" type="password" class="w-full bg-black border border-zinc-800 rounded p-3 mb-4" placeholder="clans123"><button onclick="doAdminLogin()" class="w-full bg-purple-600 font-bold py-3 rounded-xl">ENTRAR</button><p id="err" class="text-red-400 text-xs mt-3 text-center hidden">Senha incorreta</p></div></div>`}
function doAdminLogin(){const e=document.getElementById('adm_email').value,p=document.getElementById('adm_pass').value;if(e===ADMIN_EMAIL&&p===ADMIN_PASS){localStorage.setItem('rh_admin','logado');location.hash='admin-dashboard';router()}else document.getElementById('err').classList.remove('hidden')}
function renderAdminDashboard(){if(localStorage.getItem('rh_admin')!=='logado'){renderAdminLogin();return}let fat=radios.reduce((a,b)=>a+parseInt(b.valor||30),0);document.getElementById('app').innerHTML=`<div class="max-w-6xl mx-auto p-5"><h2 class="text-2xl font-black mb-2">ADMIN - ${radios.length} rádios</h2><div class="grid grid-cols-3 gap-3 mb-6"><div class="bg-zinc-900 p-4 rounded-xl">Rádios: <b>${radios.length}</b></div><div class="bg-zinc-900 p-4 rounded-xl">Fat: <b class="text-green-400">R$${fat}</b></div><div class="bg-zinc-900 p-4 rounded-xl">Ouv: <b>${radios.reduce((a,b)=>a+b.ouvintes,0)}</b></div></div><div class="bg-zinc-900 border border-zinc-800 rounded-xl overflow-auto"><table class="w-full text-sm"><thead class="bg-black text-zinc-500 text-xs"><tr><th class="p-3 text-left">Rádio</th><th>Cliente</th><th>Email</th><th>Plano</th><th>Ação</th></tr></thead><tbody>${radios.map(r=>`<tr class="border-t border-zinc-800"><td class="p-3 font-bold">${r.nome}</td><td class="p-3">${r.pessoa}</td><td class="p-3 text-xs">${r.email}</td><td class="p-3 text-green-400">${r.plano}</td><td class="p-3"><button onclick="location.hash='painel=${r.id}';router()" class="bg-white text-black px-3 py-1 rounded text-xs">Ver</button></td></tr>`).join('')||'<tr><td colspan=5 class="p-6 text-center text-zinc-500">Nenhuma</td></tr>'}</tbody></table></div><a href="/" class="text-xs text-zinc-500 mt-4 block">Voltar</a></div>`}
window.addEventListener('hashchange',router);router();
</script>
</body>
</html>
